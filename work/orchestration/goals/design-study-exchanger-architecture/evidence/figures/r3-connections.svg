  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(7.2 394.3241)">Separate primary He, PbLi and divertor streams supply each exchanger. Both layouts use the same selected inventory.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(7.2 405.521912)">Primary returns use explicit bypass control; layout-specific hydraulics,</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(7.2 416.719725)">actuator capability and added hardware costs remain unqualified.</text>
  </g>
