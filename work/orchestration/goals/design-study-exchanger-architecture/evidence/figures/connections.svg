  <g id="text_16">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(7.2 405.521912)">Separate primary He, PbLi and divertor streams supply each exchanger. Supplied split; no branch hydraulic balance.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(7.2 416.719725)">Both layouts use the same selected exchangers. Primary return requirements and layout-specific hardware remain unqualified.</text>
