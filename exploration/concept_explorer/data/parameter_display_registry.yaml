# parameter_display_registry.yaml
#
# Shared display metadata for sensitivity parameters. Patches the auto-generated
# names (`key.replace("_", " ").title()`) with human-readable names, units, and
# display multipliers (e.g., 0.46 → "Thermal Efficiency 46.0%").
#
# Merge order (later wins):
#   1. generate_parameter_metadata()           — auto: baseline + range + auto name
#   2. parameter_display_registry.yaml         — THIS FILE: shared display fields
#   3. {concept}/model_metadata.yaml           — per-concept full overrides
#
# Only the three display fields are patched here. All other ParameterMetadata
# fields (baseline, range, category, confidence) come from generation or
# per-concept yaml. Keys not in a concept's sensitivity output are silently
# ignored.
#
# Coverage: every key that appears in the tornado top-15 across the 27 costingfe
# concepts in data/ as of 2026-04-26.

# ---- Geometry / structure (m) ----
R0:
  display_name: "Major Radius"
  display_unit: "m"
  display_multiplier: 1.0
plasma_t:                       # NOTE: variable name is a misnomer; this is the minor radius `a`.
  display_name: "Minor Radius"  # See costingfe/model.py:260: `a = params["plasma_t"]`.
  display_unit: "m"
  display_multiplier: 1.0
elon:
  display_name: "Elongation κ"
  display_unit: ""
  display_multiplier: 1.0
r_coil:
  display_name: "Coil Radius"
  display_unit: "m"
  display_multiplier: 1.0
