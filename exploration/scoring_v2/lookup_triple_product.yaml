# Triple product lookup table metadata.
#
# Numerical values are NOT here — they live in weights/default.yaml under
# technical_feasibility.required_triple_product and
# technical_feasibility.achieved_triple_product.
# This file documents provenance and rationale.

required_triple_product:
  description: |
    Required triple product (n·T·τ in keV·s/m³) for scientific breakeven
    (Q_sci = 1) at the optimal ion temperature for each fuel. Derived
    from the Lawson criterion accounting for bremsstrahlung losses.
    These are breakeven targets, not commercial operating targets.

    Most fuels carry a single scalar. p-B11 is keyed by confinement
    family ('*' default + per-family overrides) because its effective
    breakeven target depends on whether steady-state alpha channeling —
    which recycles fast-alpha energy back into the fuel ions and lowers
    the required n·T·τ — is realistic in that confinement regime. The
    achieved table is deliberately NOT fuel-aware; the family keying
    lives entirely on the required side.
  entries:
    D-T:
      value: 3.0e21
      source: "Wurzel & Hsu 2022, Fig. 2 (Lawson criterion, T_opt ≈ 15 keV)"
    D-D:
      value: 3.0e23
      source: "Wurzel & Hsu 2022 (~100x harder than D-T)"
    D-He3:
      value: 5.0e22
      source: "Wurzel & Hsu 2022 (~17x harder than D-T)"
    p-B11:
      family_keyed: true
      values:
        "*":   1.4e25   # IFE / MIF / dense plasma focus — no steady-state channeling
        MFE:   5.0e24   # steady-state magnetic — alpha channeling realistic
      source: |
        Ochs et al. 2022 (Phys. Plasmas 29, 052508), p-B11 power-balance
        analysis. Un-channeled steady-state breakeven is recirculating-
        power limited at n·T·τ ≈ 1.4e25 — the '*' default, applied to all
        pulsed regimes (IFE, MIF, dense plasma focus) where steady-state
        alpha channeling cannot be sustained. With alpha channeling
        realistic in steady-state magnetic confinement (~50% of fast-alpha
        energy recycled, no direct energy conversion), the effective MFE
        target drops to ≈5.0e24.
      notes: |
        Replaces the prior flat 3.0e23 ("~100x harder than D-T, similar to
        D-D") estimate, which materially under-counted p-B11 difficulty and
        let p-B11 concepts inherit near-D-T feasibility. No ICF hot-spot /
        areal-density penalty is applied to the IFE value — the model keeps
        a single, interpretable triple-product axis rather than splicing in
        a separate inertial-confinement criterion. Assumes alpha channeling
        but NOT direct energy conversion (DEC).
    Unknown:
      value: 3.0e23
      notes: "Conservative default — treat as advanced-fuel-class until disclosed."

achieved_triple_product:
  description: |
    Best demonstrated triple product (n·T·τ in keV·s/m³) by architectural
    family. Keys are 'Confinement Family|Confinement Concept' as emitted
    by lib/extractors/derived.py. Families with no peer-reviewed
    measurement are omitted; the embedding floors them at score 1.0.

  mfe_tokamak:
    value: 1.5e21
    source: "JT-60U / JET equivalent D-T (Wurzel & Hsu 2022)"
    notes: "Same value across compact / spherical / negative-T / standard variants."

  mfe_stellarator:
    value: 1.0e20
    source: "W7-X 2025 records (IPP press release, May 22 2025)"
    notes: "All stellarator variants (QI, modular, planar, helical) at same level."

  mfe_frc_beam_driven:
    value: 1.0e19
    source: "TAE Norm; Wurzel & Hsu 2022 FRC data"
    key: "MFE|FRC"

  mfe_mirror:
    value: 1.0e18
    source: "GAMMA-10 era (no commercial-scale measurement since)"

  mfe_z_pinch_sheared_flow:
    value: 1.0e17
    source: "Zap FuZE-3 pressure-based estimates (PRNewswire Nov 18 2025)"

  mfe_levitated_dipole:
    value: 1.0e17
    source: "LDX results (historical, MIT)"

  mif_frc_compression:
    value: 1.0e19
    source: "Helion Trenta disclosures"

  mif_maglif:
    value: 1.0e19
    source: "Wurzel & Hsu 2022 (MagLIF Sandia data)"

  mif_magnetized_target_pneumatic:
    value: 1.0e18
    source: "General Fusion PI / Plasma Compression demos"

  ife_laser_icf:
    value: 5.0e21
    source: "NIF ignition (Abu-Shawareb et al., PRL 132, 065102, 2024)"
    notes: |
      Single family-best value applied to every laser ICF variant:
      direct drive, indirect drive, fast ignition, ultrashort pulse,
      hybrid drive, and liquid jet. NIF's December 2022 indirect-drive
      ignition shot is the laser ICF family's best peer-reviewed triple
      product. Per the dispatch-stated methodology, the achieved input
      is family-level and architecture-independent; sub-architectural
      risk (the gap between this benchmark and what each variant has
      actually demonstrated at scale) lives entirely in the
      laser_approach_modifier table below.

      History: prior to 2026-06-17 this entry was split into five
      sub-architecture values (5e21 / 5e21 / 1e20 / 1e18 / 1e21 for
      indirect / direct / fast ignition / ultrashort / hybrid). The
      split moved load-bearing methodology decisions out of the rule
      layer and into the data layer, defeating the framework's claim
      of rule-based scoring. The MFE families never had this problem
      (one value per family across all variants); this change brings
      laser ICF in line with that pattern. The five sub-architecture
      modifiers were re-tuned simultaneously so every per-concept TF
      score is preserved exactly.

  ife_heavy_ion:
    value: 1.0e15
    source: "NDCX-II / LBNL heavy-ion-beam research"

  ife_projectile:
    value: 1.0e17
    source: "First Light demonstrations"

  non_standard_plasma_focus:
    value: 1.0e16
    source: "LPP Fusion DPF (peer-reviewed)"

no_data_concepts:
  description: |
    Families intentionally omitted from achieved_triple_product because
    no peer-reviewed measurement exists for that architectural class.
    The embedding scores these concepts at 1.0 via the no-data floor.
  entries:
    # Note: "IFE|Laser ICF (liquid jet) (Cortex)" was previously listed here.
    # As of 2026-06-17 it uses the laser ICF family-best achieved value (5.0e21)
    # and is clamped to the 1.0 floor via a -4.00 laser_approach_modifier instead.
    # Net per-concept TF score unchanged (still 1.0).
    - "IFE|Acoustic ICF (sonofusion)"
    - "Non-Standard|Polywell"
    - "Non-Standard|Electrostatic hybrid"
    - "Non-Standard|Beam-target fusion (SHINE)"
    - "Non-Standard|Muon-catalyzed fusion"

laser_approach_modifier:
  description: |
    IFE-only modifier added to the bucket score after the gap-based
    score is computed. With laser ICF collapsed to a single family-best
    achieved value (5.0e21, NIF ignition), this table carries every bit
    of architectural-risk differentiation between variants in one
    transparent place. Magnitudes were calibrated so that the per-concept
    TF scores under the prior split-achieved scheme are preserved exactly;
    see tests/scoring_v2/test_technical_feasibility.py::test_family_consistency.
  values:
    "Indirect drive":   {modifier:  0.00, rationale: "NIF achieved ignition; reference point"}
    "Direct drive":     {modifier: -0.25, rationale: "OMEGA polar-drive projected to NIF energy; near-breakeven, no ignition shot"}
    "Hybrid drive":     {modifier: -1.25, rationale: "Conceptual KrF + direct/indirect hybrid; no near-breakeven demonstration"}
    "Fast ignition":    {modifier: -2.50, rationale: "FIREX-class results; significant gap to a fast-ignition power scheme"}
    "Ultrashort pulse": {modifier: -4.00, rationale: "Speculative ultrashort-pulse ICF; no peer-reviewed near-breakeven measurement"}
    "Liquid jet":       {modifier: -4.00, rationale: "Liquid-jet target ICF; no peer-reviewed measurement at any scale"}
