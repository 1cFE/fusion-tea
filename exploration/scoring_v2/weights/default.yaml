  axis_weight: 1.0
  embedding_weights: {}

upper_cf:
  axis_weight: 1.0
  embedding_weights: {}

technical_feasibility:
  axis_weight: 1.0
  embedding_weights: {}

data_availability:
  axis_weight: 1.0
  embedding_weights: {}
