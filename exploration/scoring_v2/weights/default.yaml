# Default weight matrix for scoring_v2 — 7 peer axes + weighted-average composite.
#
# Each axis declares:
#   axis_weight       — contribution to the composite (UI tunable, default 1.0)
#   embedding_weights — within-axis blend; embeddings must be registered in
#                       rulebook.py
#   (optional)        — axis-specific sub-tables (lookup tables, severity
#                       weights, bracket schedules) consumed by lookup-based
#                       embeddings via the `weights_yaml` keyword arg.
#
# Plain-text edits propagate via re-running score.py. No LLM call.
#
# Only the modularity axis is fully populated in this PR; the other six axes
# are placeholders that P3-P5 will populate. Until then their axis blocks
# carry an empty `embedding_weights` dict so the framework treats them as
# null (the composite skips and rescales).

composite:
  formula: weighted_average
  null_handling: skip               # rescale remaining axis_weights when an
                                    # axis is null (per design.md §1)

# ─────────────────────────────────────────────────────────────────────────
# Modularity (v5 three-component formula)
#
#   modularity_score = 0.50 × mvs + 0.25 × percent_mod + 0.25 × unit_multiplicity
#
# Source of truth: modularity_implementation_spec.md (Change A) and
# modularity_matrix_v5.md (per-concept calibration scores).
# ─────────────────────────────────────────────────────────────────────────

modularity:
  axis_weight: 1.0
  embedding_weights:
    min_viable_device_scale:        0.50
    percent_mod:                    0.25
    unit_multiplicity:              0.25

  # Corpus-wide normalization: stretch the raw modularity score distribution
  # so its mean and variance match the other ranking-driving axes (SC, PC,
  # Cust, TF, DA). Otherwise modularity's high-mean, low-variance distribution
  # makes it a value-inflator that doesn't actually discriminate. Applied
  # post-evaluation in score.py:_normalize_axes(); the lookup tables above
  # (mvs / vessel / magnet / blanket) keep their calibrated values.
  normalization:
    target_mean: 2.5
    target_variance: 1.25
    tolerance: 0.1
    floor: 1.0

  # Unit-multiplicity bracket schedule. unit_count_estimate is bucketed into
  # one of these score values; the first bracket whose max_count >= N wins.
  # Floor is the unit_count_floor_score. Boundaries calibrated against the
  # v5 matrix examples (CFS N=18 → 4, EMC2 N=6 → 3, Xcimer N=4 → 2,
  # ENN N=14 → 4, Type One/Renaissance N=40 → 5).
  unit_count_brackets:
    - {max_count: 1,  score: 1}
    - {max_count: 4,  score: 2}
    - {max_count: 10, score: 3}
    - {max_count: 30, score: 4}
  unit_count_floor_score: 5

  # Minimum viable device scale lookup. Keys built by _mvs_key() in rulebook.py
  # from confinement_family / mfe_topology / ife_driver / mif_method /
  # non_standard_mechanism / tokamak_shape / driver_technology /
  # magnet_type. Covers all 40 concepts.
  mvs_lookup:
    # MFE Tokamaks — split by shape; LTS-override below sends BEST to non-compact
    "MFE|Tokamak (compact)":              3      # CFS, Energy Singularity
    "MFE|Tokamak (spherical)":            3      # Tokamak Energy ST, ENN EHL-2
    "MFE|Tokamak (negative-T)":           3      # Firefly NTT
    "MFE|Tokamak (non-compact)":          2      # BEST (LTS, large bespoke)

    # MFE Stellarators
    "MFE|Stellarator":                    2

    # MFE Compact Toroid / FRC
    "MFE|FRC":                            4

    # MFE Open/Linear — disambiguated by primary_heating / driver_technology
    "MFE|Mirror":                         4      # Pale Blue p-B11, Realta D-T
    "MFE|Z-pinch (sheared-flow)":         4      # Zap (Ohmic self-pinch)

    # MFE Dipole — orbital variant lives at same key (lookup-key-equal)
    "MFE|Levitated dipole":               3
    "MFE|Other":                          3      # Polomac (fallback for MFE dipole-like)

    # MIF
    "MIF|MagLIF":                         5      # Pacific MagLIF
    "MIF|Pneumatic compression":          5      # General Fusion, NearStar MTIF
    "MIF|FRC compression":                5      # Helion

    # IFE Laser — Xcimer KrF gets its own key via driver_technology disambiguation
    "IFE|Laser":                          4      # generic DPSSL baseline
    "IFE|Laser (Xcimer-class)":           3      # KrF excimer (large e-beam tanks)
    "IFE|Laser (liquid jet)":             4      # Cortex (driver_technology marker)

    # IFE other drivers
    "IFE|Heavy ion beam":                 4
    "IFE|Projectile":                     3
    "IFE|Acoustic":                       5

    # Non-Standard
    "Non-Standard|Electrostatic":         5
    "Non-Standard|Plasma focus":          4
    "Non-Standard|Muon-catalyzed":        3
    "Non-Standard|Particle accelerator":  3

  # Vessel subsystem modularity. Keyed by Confinement Family | topology/method
  # | qualifier. Tokamak shape disambiguation; MIF pneumatic gets a fuel-level
  # split (D-T harder than D-D).
  #
  # 2026-06-17 retune (MFE/Non-Standard rebalancing):
  #   - Compact/spherical tokamaks: 4 → 3 (integrated divertor/blanket/cryo
  #     limits chamber modularity below the v5 anchor)
  #   - FRC: 3 → 4 (Helion-stacked small cylinders are more modular than
  #     the prior anchor implied)
  #   - Mirror: 3 → 4 (open axisymmetric chambers; WHAM/Hammir class is
  #     small + modular)
  #   - Z-pinch: 3 → 4 (key is unreachable per _vessel_key but aligning
  #     with Mirror for consistency)
  #   - Electrostatic / Plasma focus: 3 → 5 (bench/room-scale devices;
  #     Avalanche fits in a shipping container, DPF is bench-scale)
  vessel_lookup:
    "MFE|Tokamak|compact":                3    # was 4 — integrated divertor/blanket/cryo
    "MFE|Tokamak|spherical":              3    # was 4 — same integrated-subsystems reality
    "MFE|Tokamak|non-compact":            2
    "MFE|Stellarator|*":                  2
    "MFE|FRC|*":                          4    # was 3 — Helion-stacked small cylinders
    "MFE|Mirror|*":                       4    # was 3 — open axisymmetric, small modular pursuers (WHAM/Hammir)
    "MFE|Z-pinch|*":                      4    # was 3 — unreachable key per _vessel_key; aligning with Mirror
    "MFE|Dipole|*":                       3
    "MFE|Other|*":                        3

    "MIF|MagLIF|*":                       5
    "MIF|Pneumatic compression|D-T":      4
    "MIF|Pneumatic compression|D-D":      5
    "MIF|FRC compression|*":              5

    "IFE|Laser|*":                        3
    "IFE|Heavy ion beam|*":               3
    "IFE|Projectile|*":                   3
    "IFE|Acoustic|*":                     3

    "Non-Standard|Electrostatic|*":       5    # was 3 — bench/room-scale (Avalanche shipping-container scale)
    "Non-Standard|Plasma focus|*":        5    # was 3 — bench-scale DPF
    "Non-Standard|Muon-catalyzed|*":      3
    "Non-Standard|Particle accelerator|*": 3

  # Magnet/driver subsystem modularity. MFE keyed by magnet_type (with
  # Z-pinch special case via primary_heating="Ohmic (self-pinch)");
  # MIF/IFE/Non-Standard keyed by driver category.
  magnet_driver_lookup:
    "MFE|HTS (wound)|*":                  5
    "MFE|HTS (integrated)|*":             4
    "MFE|HTS (planar)|*":                 5
    "MFE|HTS (segmented)|*":              5
    "MFE|HTS (continuous helical)|*":     3
    "MFE|LTS|*":                          2
    "MFE|LTS+HTS|*":                      2
    "MFE|Resistive|*":                    3
    "MFE|Magnetic pinch|*":               3
    "MFE|N/A|*":                          3      # MFE fallback when magnet_type missing
    "MFE|TBD|*":                          3      # MFE fallback when magnet_type=TBD
    "MFE|*|*":                            3      # MFE final fallback (exotic configs)

    "MIF|*|Pulsed power":                 5
    "MIF|*|Pneumatic":                    5
    "MIF|*|Capacitor compression":        5
    "MIF|*|Railgun":                      5      # NearStar plasma armature railgun
    "MIF|*|*":                            5      # MIF fallback — Pneumatic-class by default

    "IFE|*|DPSSL Laser":                  5
    "IFE|*|Gas Laser":                    3
    "IFE|*|Heavy ion beam":               3
    "IFE|*|Projectile":                   5
    "IFE|*|Acoustic":                     3
    "IFE|*|*":                            3      # IFE fallback

    "Non-Standard|*|IEC":                 5
    "Non-Standard|*|Plasma focus":        3
    "Non-Standard|*|Particle accelerator": 3
    "Non-Standard|*|Muon catalysis":      3
    "Non-Standard|*|*":                   3      # Non-Standard fallback

  # Blanket subsystem modularity. Keyed by fuel | blanket_config.
  blanket_lookup:
    "p-B11|*":                            5
    "D-D|*":                              5
    "D-He3|*":                            5

    "D-T|Liquid metal":                   5
    "D-T|Molten salt":                    5
    "D-T|Solid breeder":                  4
    "D-T|Other/hybrid":                   4
    # TBD → 4 per the v5 BEST calibration (spec is internally inconsistent
    # between "TBD defaults to Liquid metal=5" and "BEST bl=4 in v5 matrix";
    # the calibration target wins).
    "D-T|TBD":                            4
    "D-T|N/A":                            5
    "D-T|N/A (no tritium)":               5
    "D-T|N/A (non-power)":                4

  # ─── IFE / MIF 2-slot lookups (new 2026-06-17) ───────────────────────────
  #
  # MFE keeps the legacy vessel + magnet_driver + blanket 3-slot path above.
  # IFE and MIF concepts dispatch to a 2-slot blend of (driver, chamber+blanket)
  # implemented in _percent_mod_ife_mif. No sparse-capex threshold is applied
  # for the 2-slot path — within-two normalization is well-behaved at any
  # share level (no "tiny share dominates" pathology).
  #
  # The driver_modularity rating captures factory-buildability of one driver
  # element (one beamline, one LTD cell, one cap-bank rack, one piston module).
  # Driver SIZE shows up downstream via driver_count → unit_multiplicity, not
  # here.

  driver_modularity_lookup:
    # IFE
    "IFE|DPSSL":               4.5    # diode-pumped solid-state; modular beamlines
    "IFE|KrF":                 4.0    # excimer; per-amplifier modules but gas-handling integration
    "IFE|Nd:Glass":            3.5    # flashlamp-pumped; large monolithic amplifier slabs
    "IFE|Ultrashort-pulse":    3.5    # femto/picosecond; specialty optics
    "IFE|Fiber laser CBC":     5.0    # commodity telecom-grade fiber amplifier modules (Blue Laser)
    "IFE|Heavy-ion LINAC":     2.0    # LINAC + final beamlines; precision alignment
    "IFE|Projectile gas gun":  2.5    # integrated barrel/breech
    "IFE|Acoustic transducer": 1.0    # exotic, no manufacturing precedent
    # MIF
    "MIF|Capacitor bank":      5.0    # cell stacks, factory-built (Helion)
    "MIF|LTD pulsed power":    4.5    # LTD cells modular; triggering integration
    "MIF|Pneumatic piston":    4.0    # commodity mechanical modules
    "MIF|Plasma gun":          3.0    # modular guns but precise merge geometry
    "MIF|Railgun":             2.0    # single integrated rails

  # Combined chamber + blanket modularity rating, computed as:
  #   rating = clip(chamber_base + blanket_penalty, 1.0, 5.0)
  # Decomposed so values are easy to scrub independently.
  chamber_blanket_lookup:
    chamber_base:
      "IFE|small":     5.0    # < 5 m, generic geometry
      "IFE|medium":    4.0    # 5–10 m, multiple beamline penetrations
      "IFE|large":     2.5    # > 10 m, custom port pattern (covers NIF-class)
      "MIF|compact":   5.0    # Helion linear FRC chamber
      "MIF|medium":    4.0    # GF MTF, NearStar Pb-pool chamber
      "MIF|large":     3.0    # MagLIF-class integrated pulsed-power chamber
    blanket_penalty:
      "None":          0.0    # aneutronic; no blanket required
      "Liquid metal":  0.0    # flowing fluid integrated as first wall + breeder
      "Molten salt":   0.0    # flowing fluid integrated as first wall + breeder
      "Solid breeder": -1.0   # per-port cassette assembly + neutron multiplier integration
      "Other/hybrid":  -0.5
      "TBD":           -0.5   # framework default leans liquid-metal

# ─────────────────────────────────────────────────────────────────────────
# Placeholders for the six remaining axes (P3-P5 will populate).
# Empty embedding_weights → axis scores null → composite skips and rescales.
# ─────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────
# Supply Chain — penalty-stack on critical-material bottlenecks
#
#   score = max(1.0, 5.0 - sum(severity_weights_of_triggered_bottlenecks))
#
# Triggers off fuel / blanket_config / confinement_family / primary_heating
# per modularity_implementation_spec's supply_chain_implementation_spec.md.
# ─────────────────────────────────────────────────────────────────────────

supply_chain:
  axis_weight: 1.0
  embedding_weights:
    supply_chain_score: 1.0
  bottleneck_severity_weights:
    helium3:   3.0      # Critical: no terrestrial scaling path
    tritium:   1.0      # Severe: CANDU-constrained, self-breeding the path
    lithium6:  1.0      # Severe: no commercial enrichment exists
    beryllium: 1.0      # Severe: single fusion plant ~ global annual supply
    vanadium:  1.0      # Severe: nuclear-grade V-Cr-Ti at pilot scale only
    flibe:     0.5      # Moderate: half-weight to avoid double-counting Li-6 + Be
    kdp:       0.5      # Moderate: industrial manufacturing problem

# ─────────────────────────────────────────────────────────────────────────
# Plant Complexity — penalty-stack on 14 subsystem flags.
#
#   score = max(1.0, 5.0 - sum(severity_weights_of_triggered_subsystems))
#
# Triggers off ~10 v0.3.0 features. Critical (2.0), Severe (1.0), Moderate
# (0.5) tiers per plant_complexity_implementation_spec.md.
# ─────────────────────────────────────────────────────────────────────────

plant_complexity:
  axis_weight: 1.0
  embedding_weights:
    plant_complexity_score: 1.0
  subsystem_complexity_weights:
    # Critical (2.0)
    target_factory_high:        2.0     # target-using concept at >= 1 Hz rep rate
    # Severe (1.0)
    tritium_plant:              1.0
    remote_maintenance:         1.0     # any neutronic fuel
    cryoplant_lts:              1.0
    high_power_aux:             1.0     # NBI / NBI+RF
    disruption_mitigation:      1.0     # tokamak family + Z-pinch (sheared-flow)
    pulsed_power_thermal:       1.0     # MIF / Z-pinch / DPF with thermal capture
    # Moderate (0.5)
    cryoplant_hts:              0.5
    rf_aux:                     0.5     # ECRH / ICRH
    hybrid_energy:              0.5     # Hybrid (thermal + direct)
    target_factory_low:         0.5     # target-using concept at Sub-Hz
    liquid_metal_handling:      0.5
    current_drive:              0.5     # tokamak family + non-pulsed mode
    levitation_stabilization:   0.5     # Levitated dipole concepts

# ─────────────────────────────────────────────────────────────────────────
# Customization — two sub-factors (thermal rejection + fuel safety)
# rescaled from [1,4] to [1,5].
# ─────────────────────────────────────────────────────────────────────────

customization:
  axis_weight: 1.0
  embedding_weights:
    customization_score: 1.0
  thermal_rejection_scores:
    direct_conversion: 4    # Direct (inductive), Direct (charged particle)
    hybrid:            3    # Hybrid (thermal + direct)
    thermal:           2    # Thermal (*), Pulsed power, Projectile, Neutron, TBD
  fuel_safety_scores:
    p-B11:  4               # aneutronic, no tritium
    D-He3:  3               # low neutron fraction, no tritium breeding
    D-D:    2               # neutrons but no tritium handling
    D-T:    1               # full tritium handling + breeding infrastructure

# ─────────────────────────────────────────────────────────────────────────
# Upper Capacity Factor — penalty-stack on operational architecture
#
#   score = max(1.0, 5.0 - sum(severity_weights_of_triggered_penalties))
#
# Triggers off fuel / blanket_config / operation_mode.
# ─────────────────────────────────────────────────────────────────────────

upper_cf:
  axis_weight: 1.0
  embedding_weights:
    upper_cf_score: 1.0
  operational_penalty_weights:
    pulsed_operation:      0.5    # Moderate: dwell + recharge between pulses
    neutronic_fuel:        1.0    # Severe: forced replacement outages
    non_renewable_blanket: 0.5    # Moderate: solid/static blanket replacement

  # Corpus-wide normalization: stretch the raw upper_cf distribution
  # so its mean and variance match the other ranking-driving axes.
  # Without this, raw CF sits at mean ~4 with very narrow spread (only 3 penalty
  # types), which means it's a value-inflator that doesn't actually discriminate.
  # Applied post-evaluation in score.py:_normalize_axes(); the operational
  # penalty values above stay at their original calibration.
  normalization:
    target_mean: 2.5
    target_variance: 1.25
    tolerance: 0.1
    floor: 1.0

# ─────────────────────────────────────────────────────────────────────────
# Technical Feasibility — triple-product gap on log scale.
#
#   gap = required[fuel] / achieved[family|concept]
#   score = 5-tier bucket(log10(gap)) + laser_approach_modifier (IFE only)
#
# Source: Wurzel & Hsu 2022/2025 + supplementary references documented
# in lookup_triple_product.yaml.
# ─────────────────────────────────────────────────────────────────────────

technical_feasibility:
  axis_weight: 1.0
  embedding_weights:
    technical_feasibility_score: 1.0

  # Required triple product (n·T·τ in keV·s/m³) for Q_sci = 1 breakeven.
  # A fuel maps to a single scalar, or — when the effective target depends
  # on the confinement regime — to a dict keyed by confinement family with
  # a mandatory '*' default. p-B11 is family-keyed: steady-state alpha
  # channeling (which lowers the effective target) is only realistic in
  # magnetic confinement; pulsed regimes (IFE, MIF, dense plasma focus)
  # fall through to the un-channeled '*' value. See lookup_triple_product.yaml.
  required_triple_product:
    D-T:      3.0e21
    D-D:      3.0e23
    D-He3:    5.0e22
    p-B11:
      "*":    1.4e25     # pulsed / no steady-state channeling (raw Ochs 2022)
      MFE:    5.0e24     # steady-state magnetic: alpha channeling realistic
    Unknown:  3.0e23

  # Achieved triple product by architectural family|concept. Keys match
  # the derived `confinement_concept` value (see lib/extractors/derived.py).
  # Concepts whose family has no peer-reviewed measurement are omitted —
  # the embedding returns None for them and the score floors at 1.0.
  achieved_triple_product:
    # Tokamak family — JT-60U/JET D-T projected equivalent
    "MFE|Tokamak":                              1.5e21
    "MFE|Compact tokamak":                      1.5e21
    "MFE|Spherical tokamak":                    1.5e21
    "MFE|Negative triangularity tokamak":       1.5e21

    # Stellarator family — W7-X 2025 records, all variants treated equal
    "MFE|Stellarator":                          1.0e20
    "MFE|QI stellarator":                       1.0e20
    "MFE|Modular stellarator":                  1.0e20
    "MFE|Helical coil stellarator":             1.0e20
    "MFE|Planar coil stellarator":              1.0e20

    # MFE compact toroid (TAE-class FRC, beam-driven)
    "MFE|FRC":                                  1.0e19

    # MFE mirror / Z-pinch / dipole
    "MFE|Mirror":                               1.0e18
    "MFE|Z-pinch (sheared-flow)":               1.0e17
    "MFE|Levitated dipole":                     1.0e17
    "MFE|Levitated dipole (orbital)":           1.0e17

    # MIF
    "MIF|FRC compression (MIF)":                1.0e19    # Helion
    "MIF|MagLIF":                               1.0e19    # Pacific Fusion
    "MIF|Magnetized target fusion":             1.0e18    # General Fusion / NearStar

    # IFE Laser ICF family — single family-best value across every laser-approach
    # variant. All entries share 5.0e21 (NIF ignition 2022-2025, Abu-Shawareb et
    # al. PRL 132, 065102, 2024). Sub-architectural maturity differences (direct
    # vs indirect vs fast ignition vs ultrashort vs liquid jet) live in
    # `laser_approach_modifier` below, so the lookup keys here all return the same
    # number. Same principle the MFE families already use (one value per family,
    # no per-variant judgment baked into the "achieved" input).
    "IFE|Laser ICF (direct drive)":             5.0e21
    "IFE|Laser ICF (indirect drive)":           5.0e21
    "IFE|Laser ICF (fast ignition)":            5.0e21
    "IFE|Laser ICF (ultrashort pulse)":         5.0e21
    "IFE|Laser ICF (hybrid drive)":             5.0e21
    "IFE|Laser ICF (liquid jet)":               5.0e21

    # IFE non-laser drivers
    "IFE|Heavy ion ICF":                        1.0e15    # NDCX-II / LBNL HIB research
    "IFE|Projectile ICF":                       1.0e17    # First Light demos
    # "IFE|Acoustic ICF (sonofusion)" — no peer-reviewed measurement; floor

    # Non-Standard
    "Non-Standard|Dense plasma focus":          1.0e16    # LPP DPF (peer-reviewed)
    # "Non-Standard|Polywell" — IEC/Polywell no triple-product; floor
    # "Non-Standard|Beam-target fusion" — SHINE: no plasma confinement; floor
    # "Non-Standard|Muon-catalyzed fusion" — outside Lawson framework; floor
    # "Non-Standard|Electrostatic hybrid" — no measurement; floor

  # Laser approach modifier (IFE only). The achieved_triple_product table above
  # collapses every laser ICF variant to the family-best (5.0e21, NIF ignition).
  # All architectural-risk differentiation between variants lives in this single
  # transparent table. Final score is bucket_score(log10(gap)) + modifier, clamped
  # to [1.0, 5.0]. Modifier magnitudes were calibrated so that the per-concept TF
  # scores under the pre-2026-06-17 split-achieved scheme are preserved exactly
  # (see tests/scoring_v2/test_technical_feasibility.py::test_family_consistency).
  laser_approach_modifier:
    "Indirect drive":                            0.00    # NIF achieved ignition; reference
    "Direct drive":                             -0.25    # OMEGA polar-drive projected to NIF energy; near-breakeven but no ignition shot
    "Hybrid drive":                             -1.25    # Conceptual KrF + direct/indirect hybrid; no near-breakeven demonstration
    "Fast ignition":                            -2.50    # FIREX-class results; significant gap to a fast-ignition power scheme
    "Ultrashort pulse":                         -4.00    # Speculative ultrashort-pulse ICF; no peer-reviewed near-breakeven measurement
    "Liquid jet":                               -4.00    # Liquid-jet target ICF; no peer-reviewed measurement at any scale
    "N/A":                                       0.00    # Architecture-agnostic fallback

# ─────────────────────────────────────────────────────────────────────────
# Data Availability — deterministic 1-5 lookup on the design_point.csv
# row for each concept. Inputs are the analyst-curated (LLM-proposed,
# human-verified) `grounding_confidence` ∈ {low, medium, high} and the
# count of `primary_sources` per concept.
#
# Score floors at 1.0 ("missing" bracket) for concepts not in the CSV —
# this is intentional: a missing design point is itself a strong signal
# of low data availability, not a reason to skip the axis.
# ─────────────────────────────────────────────────────────────────────────

data_availability:
  axis_weight: 1.0
  embedding_weights:
    data_availability_score: 1.0
  grounding_confidence_brackets:
    missing: 1.0                # not in design_point.csv / null confidence
    low: 2.0
    medium: 3.0
    high_without_sources: 4.0   # high confidence + < threshold primary sources
    high_with_sources: 5.0      # high confidence + >= threshold primary sources
    high_sources_threshold: 3
