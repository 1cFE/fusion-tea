# Feature schema for scoring_v2.
#
# Single source of truth for what features exist, their type, valid values,
# whether they are required, and which extractor populates them.
#
# Feature files (features/{concept_id}.yaml) are tool-managed by extract.py;
# do not hand-edit unless you intend to (and run schema validation after).
#
# v3 schema reconciliation (P1 of scoring-v3-rewrite):
# - Added 5 taxonomy-extracted columns surfaced by ontology v0.3.0:
#     primary_heating, blanket_config, repetition_rate, laser_approach,
#     non_standard_mechanism
# - Added derived feature `confinement_concept` (disambiguation per
#   Technical Feasibility implementation spec).
# - Added manual feature `gap_report_path` consumed by Data Availability axis.
# - Retired pre-v3 orphans `tritium_breeding`, `neutron_management` (the
#   source columns were dropped from table.csv by ontology v3 / PR #16; no
#   downstream axis still depends on them).

# ─── Confinement taxonomy ────────────────────────────────────────────────

confinement_family:
  type: enum
  values: [MFE, IFE, MIF, Non-Standard]
  required: true
  extractor: taxonomy
  taxonomy_column: "Confinement Family"

mfe_topology:
  type: enum
  values: [Tokamak, Stellarator, "Open/Linear", "Compact Toroid", Dipole, "N/A"]
  required: true
  extractor: taxonomy
  taxonomy_column: "MFE Topology"

ife_driver:
  type: enum
  values: [Acoustic, "Heavy ion beam", Laser, Projectile, "N/A"]
  required: true
  extractor: taxonomy
  taxonomy_column: "IFE Driver"

mif_method:
  type: enum
  values: ["FRC compression", "Magnetized target", "N/A"]
  required: true
  extractor: taxonomy
  taxonomy_column: "MIF Method"

non_standard_mechanism:
  type: enum
  values: [Electrostatic, "Muon-catalyzed", "Plasma focus", "N/A"]
  required: true
  extractor: taxonomy
  taxonomy_column: "Non-Standard Mechanism"

tokamak_shape:
  type: enum
  values: [Compact, Spherical, Standard, "Negative triangularity", "N/A"]
  required: true
  extractor: taxonomy
  taxonomy_column: "Tokamak Shape"

stellarator_type:
  type: enum
  values: ["Helical coil", Modular, "Planar coil", QI, "N/A"]
  required: false
  extractor: taxonomy
  taxonomy_column: "Stellarator Type"

laser_approach:
  type: enum
  values:
    - "Direct drive"
    - "Indirect drive"
    - "Fast ignition"
    - "Hybrid drive"
    - "Liquid jet"
    - "Ultrashort pulse"
    - "N/A"
  required: true
  extractor: taxonomy
  taxonomy_column: "Laser Approach"

# Derived: collapses confinement_family / mfe_topology / ife_driver / mif_method
# / non_standard_mechanism / laser_approach into a single canonical concept
# label used by Technical Feasibility (triple-product lookup) and reporting.
# Disambiguation rules live in lib/extractors/derived.py.
confinement_concept:
  type: string
  required: true
  extractor: derived

# ─── Fuel cycle & operation ──────────────────────────────────────────────

fuel:
  type: enum
  values: [D-T, D-D, D-He3, p-B11]
  required: true
  extractor: taxonomy
  taxonomy_column: "Fuel"

operation_mode:
  type: enum
  values: [Pulsed, "Quasi-steady", "Steady-state"]
  required: true
  extractor: taxonomy
  taxonomy_column: "Operation Mode"

repetition_rate:
  type: enum
  values:
    - "Sub-Hz"
    - "~1 Hz"
    - "~10 Hz"
    - "High (>10 Hz)"
    - "kHz"
    - "Unknown"
    - "N/A"
  required: true
  extractor: taxonomy
  taxonomy_column: "Repetition Rate"

# ─── Heating & drive ──────────────────────────────────────────────────────

primary_heating:
  type: string
  required: true
  extractor: taxonomy
  taxonomy_column: "Primary Heating"

driver_technology:
  type: string
  required: false
  extractor: taxonomy
  taxonomy_column: "Driver Technology"

# ─── Magnet, blanket, energy capture ─────────────────────────────────────

magnet_type:
  type: string
  required: true
  extractor: taxonomy
  taxonomy_column: "Magnet Type"

blanket_config:
  type: enum
  values:
    - "Liquid metal"
    - "Molten salt"
    - "Solid breeder"
    - "Other/hybrid"
    - "TBD"
    - "N/A"
    - "N/A (no tritium)"
    - "N/A (non-power)"
  required: true
  extractor: taxonomy
  taxonomy_column: "Blanket Config"

energy_capture:
  type: string
  required: true
  extractor: taxonomy
  taxonomy_column: "Energy Capture"

# ─── Capex weight shares (cost_model) ────────────────────────────────────
#
# Per-concept capex weight shares populated by the cost_model extractor from
# exploration/concept_analysis/analyses/{cid}/model_output.txt. Absent when
# no model_output.txt exists for the concept (no fallback).
#
# P2 of the scoring-v3 rewrite retired w_bop, w_fuel_cycle, w_aux, w_civil:
# the modularity v5 percent_mod formula only consumes vessel/coils/blanket
# (the four retired subsystems "are rarely modularized in any concept and
# dilute the signal" per the v5 calibration narrative).

w_vessel:
  type: float
  required: false
  extractor: cost_model

w_coils:
  type: float
  required: false
  extractor: cost_model

w_blanket:
  type: float
  required: false
  extractor: cost_model

# ─── Manual axis inputs ──────────────────────────────────────────────────

# Number of identical factory-built precision units per plant (TF coil
# segments, DPSSL beamlines, capacitor brick arrays, mirror cells, etc.).
# Consumed by the modularity v5 unit_multiplicity rating embedding via a
# bracket schedule (N=1 → 1, N=2 → 2, N=5-10 → 3, N=15-30 → 4, N≥50 → 5).
# Populated manually per concept from architecture analysis (per the v5
# matrix's narrative cells); see modularity_implementation_spec.md
# Change E for the source-of-truth per-concept values.
unit_count_estimate:
  type: int
  required: true
  extractor: manual

# Data Availability inputs sourced from
# exploration/concept_analysis/tables/design_point.csv via
# exploration/scoring_v2/scripts/populate_data_availability.py.
# Concepts absent from the CSV omit these fields and floor at score 1.0.
design_point_grounding_confidence:
  type: string
  required: false
  extractor: manual
design_point_primary_sources_count:
  type: int
  required: false
  extractor: manual
