   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #152b40" transform="translate(316.602 146.107331)">Resolve calculation inputs</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #152b40" transform="translate(316.602 162.73605)">Translate equations to Python</text>
