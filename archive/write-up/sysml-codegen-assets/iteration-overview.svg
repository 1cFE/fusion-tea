   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2463a5" x="54.9" y="128.571975" transform="rotate(-0 54.9 128.571975)">AUTHOR THE PLANT</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #152b40" transform="translate(54.9 146.107331)">SysML parts and connections</text>
