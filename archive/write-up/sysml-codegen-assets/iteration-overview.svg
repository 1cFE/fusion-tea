   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e83" x="578.304" y="128.571975" transform="rotate(-0 578.304 128.571975)">EVALUATE A CANDIDATE</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #152b40" transform="translate(578.304 146.107331)">Set radius and ampere-turns</text>
