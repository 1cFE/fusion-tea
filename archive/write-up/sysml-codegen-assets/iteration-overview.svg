   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b40" x="27.558" y="33.316406" transform="rotate(-0 27.558 33.316406)">One model, two kinds of iteration</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677a" x="27.558" y="59.234606" transform="rotate(-0 27.558 59.234606)">Stellarator component changes regenerate the program. Parameter studies reuse it.</text>
