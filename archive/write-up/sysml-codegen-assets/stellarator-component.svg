   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b40" x="32.58" y="39.1248" transform="rotate(-0 32.58 39.1248)">The equation, the plant inputs, and the calculated field</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677a" x="32.58" y="69.0624" transform="rotate(-0 32.58 69.0624)">Actual SysML excerpts • imports, documentation, and other members omitted; empty braces held documentation</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2463a5" x="57.69" y="154.615969" transform="rotate(-0 57.69 154.615969)">CALCULATION DEFINITION — the mathematical relationship</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.8px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 178.714844)">calc def 'Coil Set Axis Field' {</text>
    <text style="font-size: 11.8px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 193.357814)">    in attribute n_coils : Real;</text>
    <text style="font-size: 11.8px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 208.328972)">    in attribute I_coil : Real;</text>
    <text style="font-size: 11.8px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 223.30013)">    in attribute k_link : Real;</text>
    <text style="font-size: 11.8px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 238.271287)">    in attribute R0 : Real;</text>
    <text style="font-size: 11.8px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 252.914258)">    in attribute mu0 : Real default 1.25663706212e-6;</text>
    <text style="font-size: 11.8px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 267.557228)">    in attribute two_pi : Real default 6.283185307179586;</text>
    <text style="font-size: 11.8px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 282.528386)"/>
    <text style="font-size: 11.8px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 297.171356)">    out attribute B_axis : Real = mu0 * k_link * n_coils * I_coil / (two_pi * R0);</text>
    <text style="font-size: 11.8px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 312.142514)">}</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #087e83" x="57.69" y="449.074125" transform="rotate(-0 57.69 449.074125)">PLANT USAGE — supplies the coil values</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 469.535225)">part stellaris : 'MFE Power Plant' {</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 482.440894)">    part :&gt;&gt; magnet {</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 495.418062)">        part :&gt;&gt; coil {</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 508.323731)">            :&gt;&gt; n_coils = 48.0 {}</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 521.51865)">            :&gt;&gt; I_coil = 15400000.0 {}</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 534.713569)">            :&gt;&gt; k_link = 0.7731331164622419 {}</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 547.908487)">        }</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 560.814156)">    }</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(57.69 573.719825)">}</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677a" x="57.69" y="617.580759" transform="rotate(-0 57.69 617.580759)">Inherited coil binding from 'MFE Power Plant':</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans Mono'; text-anchor: start; fill: #152b40" x="57.69" y="640.854897" transform="rotate(-0 57.69 640.854897)">:&gt;&gt; R0 = plasma.R {}</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2463a5" x="505.485" y="449.074125" transform="rotate(-0 505.485 449.074125)">CALCULATION USAGE — selects those values</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(505.485 469.535225)">calc field_calc : 'Coil Set Axis Field' {</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(505.485 482.730144)">    in n_coils = coil.n_coils;</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(505.485 495.925062)">    in I_coil = coil.I_coil;</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(505.485 509.119981)">    in k_link = coil.k_link;</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(505.485 522.3149)">    in R0 = coil.R0;</text>
    <text style="font-size: 10.4px; font-family: 'DejaVu Sans Mono'; fill: #152b40" transform="translate(505.485 535.220569)">}</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(505.485 584.544713)">Owned by 'Magnet System'.</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(505.485 599.920875)">mu0 and two_pi retain their defaults.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2463a5" x="57.69" y="790.789969" transform="rotate(-0 57.69 790.789969)">COMPONENT ATTRIBUTE — exposes the result inside 'Magnet System'</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.8px; font-family: 'DejaVu Sans Mono'; text-anchor: start; fill: #152b40" x="57.69" y="809.899244" transform="rotate(-0 57.69 809.899244)">attribute B : Real = field_calc.B_axis;</text>
   </g>
  </g>
 </g>
