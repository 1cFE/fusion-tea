[project]
name = "ralph-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "costingfe",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true

[tool.uv.sources]
costingfe = { path = "../1costingfe", editable = true }

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "types-pyyaml>=6.0.12.20250915",
]
