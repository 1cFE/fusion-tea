[project]
name = "fusion-tea"
version = "0.1.0"
description = "Fusion Techno-Economic Analysis"
requires-python = ">=3.12"
dependencies = [
    # Pipeline dependencies
    "agentic-mbse[extract-full,web]==0.1.3",
    "1costingfe==0.1.0",
    "sysml-codegen==0.1.1",
    "pytest>=8.0",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "httpx>=0.28.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "pyzotero>=1.10.0",
    "python-dotenv>=1.2.1",
    "graphviz>=0.21",
    # Explorer additions
    "jinja2>=3.1.6",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "markdown>=3.10.2",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
e2e = ["playwright>=1.58.0"]

[dependency-groups]
dev = ["mypy>=1.10", "ruff>=0.4", "types-pyyaml"]

[tool.uv.sources]
1costingfe = { git = "https://github.com/1cFE/1costingfe.git", rev = "02543850089be175ea7c28b92a8b2a4184e1637e" }
agentic-mbse = { git = "https://github.com/1cFE/agentic-mbse.git", rev = "443388823f0db46c14df1728d3843d0a74ee7590" }
sysml-codegen = { git = "https://github.com/1cFE/sysml-codegen.git", rev = "8a758e9240707b58fe32a509c3b509941ca4fa01" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
markers = ["slow: long-running integration tests"]
# Bare `pytest` at the repo root otherwise sweeps generated TEA packages (which import
# simkit/<package> from their own roots) and proof_of_concept/tests, whose __init__.py
# binds the top-level name `tests` and hides our namespace-package tests/ tree.
testpaths = ["tests"]
norecursedirs = ["archive", "exploration", "generated", "proof_of_concept", ".venv", "_work"]
