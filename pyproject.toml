[project]
name = "fusion-tea"
version = "0.1.0"
description = "Fusion Techno-Economic Analysis"
requires-python = ">=3.12"
dependencies = [
    # Pipeline dependencies
    "agentic-mbse[extract-full,web]",
    "costingfe",
    "sysml-codegen",
    "pytest>=8.0",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "httpx>=0.28.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "pyzotero>=1.10.0",
    "python-dotenv>=1.2.1",
    "graphviz>=0.21",
    # Explorer additions
    "jinja2>=3.1.6",
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
e2e = ["playwright>=1.58.0"]

[dependency-groups]
dev = ["mypy>=1.10", "ruff>=0.4", "types-pyyaml"]

[tool.uv.sources]
costingfe = { path = "../1costingfe", editable = true }
agentic-mbse = { path = "../agentic-mbse", editable = true }
sysml-codegen = { path = "../sysml-codegen", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["."]
