[project]
name = "fusion-tea"
version = "0.1.0"
description = "Fusion Techno-Economic Analysis"
requires-python = ">=3.12"
dependencies = [
    # Pipeline dependencies
    "agentic-mbse[extract-full,web]==0.1.3",
    "1costingfe==0.1.0",
    "sysml-codegen==0.1.1",
    "pytest>=8.0",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "httpx>=0.28.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "pyzotero>=1.10.0",
    "python-dotenv>=1.2.1",
    "graphviz>=0.21",
    # Explorer additions
    "jinja2>=3.1.6",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "markdown>=3.10.2",
]

[project.optional-dependencies]
e2e = ["playwright>=1.58.0"]

[dependency-groups]
dev = ["mypy>=1.10", "ruff>=0.4", "types-pyyaml"]

[tool.uv.sources]
1costingfe = { git = "https://github.com/1cFE/1costingfe.git", rev = "02543850089be175ea7c28b92a8b2a4184e1637e" }
agentic-mbse = { git = "https://github.com/1cFE/agentic-mbse.git", rev = "3f8bd587af40f05b929dd56645901dada7daea37" }
sysml-codegen = { git = "https://github.com/1cFE/sysml-codegen.git", rev = "075a842d48f47b5a2720aa7f15c4ac50cdcdb570" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["."]
