      .artifact-box { fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 1; rx: 6; }
      .artifact-text { font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace; font-size: 11px; fill: #059669; }
      .artifact-arrow { fill: #059669; font-size: 11px; }
      .dashed-sep { stroke: #c4b5fd; stroke-width: 1; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <!-- RESEARCH -->
