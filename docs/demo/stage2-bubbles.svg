<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 764 214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .sp-box { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.5; rx: 12; }
      .sp-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; fill: #7c3aed; }
      .sp-item { font-size: 12px; fill: #555; }
