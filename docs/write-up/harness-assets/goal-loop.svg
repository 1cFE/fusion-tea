   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b40" x="21.6" y="34.594688" transform="rotate(-0 21.6 34.594688)">One question, pursued in checked rounds</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b40" x="21.6" y="80.903125" transform="rotate(-0 21.6 80.903125)">QUESTION</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(21.6 101.578359)">fixed for the</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(21.6 114.931734)">whole goal</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b40" x="21.6" y="181.703125" transform="rotate(-0 21.6 181.703125)">ROUNDS</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(21.6 202.378359)">bounded attempts</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(21.6 215.731734)">by the AI: at most</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(21.6 229.085109)">one model change</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(21.6 242.438484)">and one study each</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b40" x="21.6" y="404.903125" transform="rotate(-0 21.6 404.903125)">CHECKS</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(21.6 425.578359)">nothing builds on</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(21.6 438.931734)">a round until it</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(21.6 452.285109)">has been checked</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152b40" x="223.2" y="81.568438" transform="rotate(-0 223.2 81.568438)">The goal: a question with a defined answer</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677a" x="223.2" y="103.835312" transform="rotate(-0 223.2 103.835312)">What we want to know, what counts as answered, the effort allowed, and the calls the owner keeps.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2463a5" x="223.2" y="180.263125" transform="rotate(-0 223.2 180.263125)">Round N</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2463a5" x="237.6" y="221.027187" transform="rotate(-0 237.6 221.027187)">Approach</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(237.6 243.266391)">a bet on how to answer:</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(237.6 256.365416)">what we'll try, what we</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(237.6 269.464441)">assume, what would make</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(237.6 282.563466)">us drop it. No task list.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2463a5" x="428.4" y="221.027187" transform="rotate(-0 428.4 221.027187)">Tasks, one at a time</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b40" x="467.64" y="249.275312" transform="rotate(-0 467.64 249.275312)">research</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b40" x="558.36" y="249.275312" transform="rotate(-0 558.36 249.275312)">model change</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b40" x="639.72" y="249.275312" transform="rotate(-0 639.72 249.275312)">study</text>
   </g>
   <g id="text_17">
    <text style="font-style: italic; font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2463a5" x="549" y="296.464187" transform="rotate(-0 549 296.464187)">the next task depends on what the last one found</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2463a5" x="723.6" y="221.027187" transform="rotate(-0 723.6 221.027187)">Round record</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(723.6 243.266391)">what was tried, what</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(723.6 256.365416)">was found, and why</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(723.6 269.464441)">the round stopped</text>
   </g>
   <g id="text_20">
    <text style="font-style: italic; font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677a" x="223.2" y="327.424187" transform="rotate(-0 223.2 327.424187)">In section 4, round 1 ran one research task. Round 2 made one model change, then ran one study.</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #087e83" x="775.8" y="404.489219" transform="rotate(-0 775.8 404.489219)">✓ Fresh review</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(723.928906 421.580547)">by someone who did</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(736.30625 433.538203)">not do the work</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b75f1c" x="532.8" y="404.489219" transform="rotate(-0 532.8 404.489219)">Owner</text>
   </g>
   <g id="text_24">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52677a" x="532.8" y="428.999375" transform="rotate(-0 532.8 428.999375)">is the goal answered?</text>
   </g>
   <g id="text_25">
    <text style="font-style: italic; font-size: 10px; font-family: 'DejaVu Sans'; fill: #2463a5" transform="translate(270.383594 394.202656)">not yet: next round,</text>
    <text style="font-style: italic; font-size: 10px; font-family: 'DejaVu Sans'; fill: #2463a5" transform="translate(260.116406 406.160312)">with a revised approach</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #152b40" x="532.8" y="507.449219" transform="rotate(-0 532.8 507.449219)">Goal closed</text>
