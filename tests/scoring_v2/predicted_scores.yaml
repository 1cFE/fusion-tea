# Predicted-scores conformance fixture for the 7-axis scoring framework.
#
# This file is the SINGLE SOURCE OF TRUTH for what scores the implementation
# must reproduce. Each axis maps {concept_id: predicted_score}.
#
# `tests/scoring_v2/test_spec_conformance.py::TestSpecPredictedScoresLand`
# parameterizes over this file. Concepts with null values are explicitly
# un-anchored (no value in the spec to verify against); the test skips them.
#
# Scores are extracted verbatim from each axis's implementation spec:
#   - modularity:           modularity_implementation_spec.md (sparse anchors only;
#                            full table pending modularity_matrix_v5.md upload)
#   - supply_chain:         supply_chain_implementation_spec.md (full 40)
#   - plant_complexity:     plant_complexity_implementation_spec.md (planning-doc
#                            enumerated set; remaining concepts null until
#                            verified against actual v3-ontology features)
#   - customization:        customization_implementation_spec.md (full 39)
#   - upper_cf:             upper_cf_implementation_spec.md (full 39)
#   - technical_feasibility: technical_feasibility_implementation_spec.md (full 39)
#
# data_availability is intentionally NOT included here. The axis is a
# deterministic bucket lookup on the gap-report blocking count, with no
# spec-vs-rules calibration gap to verify. It is exhaustively unit-tested
# in test_data_availability.py (TestBucketSchedule covers every bracket
# boundary; TestStructuredSummaryCount + TestCounting cover the parsers).
# Keeping a per-concept fixture here would silently drift on every
# gap-report regeneration without catching any failure mode the unit
# tests don't already cover.
#
# Tolerance: 0.05 (rounding). Updates require coordinated spec edit + this file.

