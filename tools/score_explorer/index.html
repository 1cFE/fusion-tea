<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fusion Concept Score Explorer</title>

  <!-- React 18 + htm via CDN. No build step, no Babel — htm is a
       ~600-byte tagged-template helper that builds React elements
       directly. Tagged template literals are ES6; every modern browser
       supports them natively. -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <style>
    :root {
      --bg: #0f1115;
      --panel: #161922;
      --panel-2: #1d2230;
      --border: #2a3142;
      --text: #e6e8ee;
      --text-dim: #a3a8b5;
      --accent: #7aa2f7;
      --accent-2: #9ece6a;
      --warn: #e0af68;
      --bad: #f7768e;
      --null: #565f73;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
                 font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    h1, h2, h3 { margin: 0; font-weight: 500; }
    h1 { font-size: 20px; }
    h2 { font-size: 15px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
    h3 { font-size: 13px; color: var(--text-dim); }
    .app { display: grid; grid-template-columns: 340px 1fr; min-height: 100vh; gap: 0; }
    .sidebar { background: var(--panel); border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; }
    .main    { padding: 16px 24px; overflow-x: auto; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .header .subtitle { color: var(--text-dim); font-size: 12px; }

    .presets { display: flex; gap: 6px; margin: 8px 0 16px 0; flex-wrap: wrap; }
    .presets button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
                      padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .presets button:hover { border-color: var(--accent); }
    .presets button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

    .slider-row { padding: 6px 0; }
    .slider-row .label { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .slider-row .label .name { color: var(--text); }
    .slider-row .label .value { color: var(--accent); font-variant-numeric: tabular-nums; }
    .slider-row input[type=range] { width: 100%; }
    .slider-row .advanced { font-size: 11px; color: var(--text-dim); cursor: pointer; margin-top: 2px;
                            user-select: none; }
    .slider-row .advanced:hover { color: var(--accent); }
    .slider-row .advanced-panel { margin-top: 6px; padding: 8px; background: var(--bg);
                                  border: 1px solid var(--border); border-radius: 4px; font-size: 11px;
                                  font-family: ui-monospace, "SF Mono", Consolas, monospace; max-height: 200px; overflow-y: auto; }
    .advanced-panel .table-name { color: var(--accent-2); margin-top: 4px; }
    .advanced-panel .row { display: flex; justify-content: space-between; padding: 1px 0; }
    .advanced-panel .row .k { color: var(--text-dim); }
    .advanced-panel .row .v { color: var(--text); }

    .actions { display: flex; gap: 8px; margin: 16px 0 8px 0; }
    .actions button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
                      padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; flex: 1; }
    .actions button:hover { border-color: var(--accent); }
    .actions button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }

    table.ranking { width: 100%; border-collapse: collapse; }
    table.ranking th, table.ranking td { padding: 6px 8px; border-bottom: 1px solid var(--border);
                                          text-align: left; font-size: 12px; vertical-align: middle; }
    table.ranking th { color: var(--text-dim); font-weight: 500; cursor: pointer; user-select: none;
                       position: sticky; top: 0; background: var(--bg); z-index: 1; }
    table.ranking th.sorted { color: var(--accent); }
    table.ranking td.num { font-variant-numeric: tabular-nums; text-align: right; width: 60px; }
    table.ranking td.composite { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600;
                                 color: var(--accent); }
    table.ranking tr.selected { background: rgba(122, 162, 247, 0.10); }
    table.ranking tr:hover { background: rgba(255, 255, 255, 0.02); cursor: pointer; }
    table.ranking td.num { position: relative; cursor: help; }

    /* Custom hover tooltip — replaces native `title=` so it renders
       instantly, supports multi-line content, and styles consistently. */
    td[data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      z-index: 100;
      bottom: calc(100% + 4px);
      right: 0;
      min-width: 260px;
      max-width: 420px;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      color: var(--text);
      font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-variant-numeric: normal;
      font-weight: normal;
      text-align: left;
      white-space: pre-line;       /* preserves \n as line break */
      pointer-events: none;
    }
    /* Composite cell gets its own tooltip too */
    td.composite { position: relative; cursor: help; }

    .concept-cell .display-name { font-weight: 500; color: var(--text); }
    .concept-cell .company       { color: var(--accent); font-size: 11px; margin-top: 1px; }
    .concept-cell .meta          { color: var(--text-dim); font-size: 11px; margin-top: 1px; }
    .tooltip-flag                { color: var(--warn); font-weight: 500; }
    .null { color: var(--null); }
    .score-1 { color: var(--bad); }
    .score-2 { color: var(--warn); }
    .score-3 { color: var(--text); }
    .score-4 { color: var(--accent-2); }
    .score-5 { color: var(--accent-2); font-weight: 600; }

    .filter-bar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .filter-bar input { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
                        padding: 6px 10px; border-radius: 4px; flex: 1; font-size: 13px; }
    .filter-bar select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
                         padding: 6px 10px; border-radius: 4px; font-size: 13px; }
    .readiness-toggle { display: flex; align-items: center; gap: 8px; margin-top: 14px;
                        padding: 10px 12px; background: var(--panel-2);
                        border: 1px solid var(--border); border-radius: 4px;
                        color: var(--text); font-size: 14px; cursor: pointer;
                        user-select: none; }
    .readiness-toggle:hover { border-color: var(--accent); }
    .readiness-toggle input { cursor: pointer; margin: 0; width: 15px; height: 15px;
                              accent-color: var(--accent); flex-shrink: 0; }
    .readiness-toggle .rt-count { color: var(--text-dim); font-size: 12px; margin-left: 2px; }

    .detail { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
              padding: 16px; margin-top: 16px; }
    .detail h2 { margin-bottom: 4px; }
    .detail .concept-name { font-size: 18px; color: var(--text); margin-bottom: 8px; }
    .detail .features-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                              gap: 6px 12px; font-size: 12px; margin-bottom: 16px; }
    .detail .features-grid .k { color: var(--text-dim); }
    .detail .features-grid .v { color: var(--text); }
    .detail .diagnostic { background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
                          padding: 8px 12px; margin-bottom: 8px; }
    .detail .diagnostic h3 { color: var(--accent); display: flex; justify-content: space-between; }
    .detail .diagnostic h3 .axis-score { color: var(--text); font-size: 13px; font-variant-numeric: tabular-nums; }
    .detail .diagnostic pre { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px;
                              white-space: pre-wrap; word-break: break-word; margin: 6px 0 0 0;
                              color: var(--text-dim); }

    .footer { color: var(--text-dim); font-size: 11px; margin-top: 24px; padding-top: 16px;
              border-top: 1px solid var(--border); }

    .fatal-error { padding: 24px; max-width: 900px; margin: 40px auto; background: var(--panel);
                   border: 1px solid var(--bad); border-radius: 6px; }
    .fatal-error h2 { color: var(--bad); margin-bottom: 8px; }
    .fatal-error pre { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px;
                       background: var(--bg); padding: 12px; border-radius: 4px; overflow: auto;
                       color: var(--warn); white-space: pre-wrap; word-break: break-word; }

    /* ── Onboarding wizard ───────────────────────────────────────── */
    .wizard { min-height: 100vh; display: flex; flex-direction: column;
              align-items: center; justify-content: center; padding: 32px 20px;
              overflow-y: auto; }
    .wizard-card { background: var(--panel); border: 1px solid var(--border);
                   border-radius: 10px; max-width: 720px; width: 100%;
                   padding: 26px 32px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
    .wizard-progress { display: flex; gap: 5px; margin-bottom: 20px; }
    .wizard-progress .dot { height: 6px; flex: 1; border-radius: 3px;
                            background: var(--border); cursor: pointer; }
    .wizard-progress .dot.done    { background: var(--accent-2); }
    .wizard-progress .dot.current { background: var(--accent); }
    .wizard-eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
                      color: var(--accent); margin-bottom: 6px; }
    .wizard-card h1 { font-size: 24px; margin-bottom: 12px; }
    .wizard-lead { font-size: 15px; line-height: 1.6; color: var(--text); margin-bottom: 16px; }
    .wizard-section { margin-bottom: 14px; }
    .wizard-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
                         color: var(--text-dim); margin-bottom: 4px; }
    .wizard-section p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--text); }
    .wizard-scale { display: flex; gap: 12px; margin-top: 16px; }
    .wizard-scale .end { flex: 1; background: var(--bg); border: 1px solid var(--border);
                         border-radius: 6px; padding: 8px 11px; font-size: 12px; }
    .wizard-scale .end .n { font-weight: 600; }
    .wizard-scale .lo .n { color: var(--bad); }
    .wizard-scale .hi .n { color: var(--accent-2); }
    .wizard-scale .end .t { color: var(--text-dim); display: block; margin-top: 2px; }
    .wizard-nav { display: flex; align-items: center; justify-content: space-between;
                  margin-top: 24px; gap: 12px; }
    .wizard-nav .step-count { color: var(--text-dim); font-size: 12px;
                              font-variant-numeric: tabular-nums; }
    .wizard-nav button { background: var(--panel-2); color: var(--text);
                         border: 1px solid var(--border); padding: 9px 18px;
                         border-radius: 5px; cursor: pointer; font-size: 13px; }
    .wizard-nav button:hover:not(:disabled) { border-color: var(--accent); }
    .wizard-nav button:disabled { opacity: 0.35; cursor: default; }
    .wizard-nav button.primary { background: var(--accent); color: var(--bg);
                                 border-color: var(--accent); font-weight: 500; }
    .wizard-skip { background: none; border: none; color: var(--text-dim); font-size: 12px;
                   cursor: pointer; margin-top: 14px; text-decoration: underline; }
    .wizard-skip:hover { color: var(--accent); }
    .wizard-cta { display: inline-block; margin-top: 6px; padding: 9px 16px;
                  background: var(--accent); color: var(--bg); border-radius: 5px;
                  font-size: 13px; font-weight: 500; text-decoration: none; }
    .wizard-cta:hover { filter: brightness(1.12); }
    .guide-btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
                 padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
                 white-space: nowrap; }
    .guide-btn:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <div id="root">Loading…</div>

  <!-- Show any uncaught error directly on the page so the user doesn't
       have to dig in DevTools to see what went wrong. -->
  <script>
    window.addEventListener("error", function (e) {
      var el = document.getElementById("root");
      if (el) {
        el.innerHTML =
          '<div class="fatal-error">' +
          '<h2>Score Explorer failed to load</h2>' +
          '<p>Open DevTools (F12) for full details. Top-line error:</p>' +
          '<pre></pre>' +
          '</div>';
        el.querySelector("pre").textContent =
          (e.error && (e.error.stack || e.error.message)) || e.message || String(e);
      }
    });
    window.addEventListener("unhandledrejection", function (e) {
      var el = document.getElementById("root");
      if (el) {
        el.innerHTML =
          '<div class="fatal-error">' +
          '<h2>Score Explorer: unhandled promise rejection</h2>' +
          '<pre></pre>' +
          '</div>';
        el.querySelector("pre").textContent =
          (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason);
      }
    });
  </script>

  <script type="module">
    import htm from "https://unpkg.com/htm@3.1.1?module";
    const html = htm.bind(React.createElement);
    const { useEffect, useMemo, useState } = React;

    const AXES = [
      "modularity", "supply_chain", "plant_complexity", "customization",
      "upper_cf", "technical_feasibility", "data_availability",
    ];
    const AXIS_LABEL = {
      modularity:            "Modularity",
      supply_chain:          "Supply Chain",
      plant_complexity:      "Plant Complexity",
      customization:         "Customization",
      upper_cf:              "Capacity Factor",
      technical_feasibility: "Technical Feasibility",
      data_availability:     "Data Availability",
    };

    const PRESETS = {
      "Equal":            Object.fromEntries(AXES.map(a => [a, 1.0])),
      "Physics-first":    Object.fromEntries(AXES.map(a =>
        [a, (a === "technical_feasibility" || a === "data_availability") ? 3.0 : 1.0])),
      "Commercial-first": Object.fromEntries(AXES.map(a =>
        [a, (a === "technical_feasibility" || a === "data_availability") ? 1.0 : 3.0])),
    };

    // ── Onboarding walkthrough content ──────────────────────────────
    // Plain prose, no markup. Safe to edit/reword freely — the Wizard
    // component just renders these objects in order.
    const WIZARD_STEPS = [
      {
        eyebrow: "Walkthrough · about 2 minutes",
        title: "Comparing 39 fusion concepts",
        lead: "This tool ranks 39 private-sector fusion concepts on a single composite score, built from seven independent axes. The score is a screening lens for techno-economics — a way to compare very different bets side by side — not a prediction of which concept will win.",
        sections: [
          { h: "How it works", p: "Each axis applies a fixed, transparent formula to a structured set of per-concept features, producing a 1 to 5 score. Those features are themselves synthesized by upstream agentic (LLM-assisted) research — so the judgment lives in how the features are gathered, not in the scoring step. You decide how much each axis matters by sliding its weight, and the ranking re-sorts instantly." },
        ],
      },
      {
        eyebrow: "Axis 1 of 7",
        title: "Modularity",
        lead: "Whether the plant can be built from many small, repeated, factory-made units — or has to be assembled once, on-site, as a single bespoke machine.",
        sections: [
          { h: "How it's scored", p: "Combines the minimum viable device scale, the modularity of the major subsystems (vessel, magnets or driver, blanket), and how many identical units a plant needs." },
          { h: "Why it drives cost", p: "Factory-replicated parts can ride a learning curve — costs tend to fall as more identical units are built — whereas a one-off, on-site megaproject captures little of that effect. Modularity therefore shapes how far costs can fall as a design moves from a first-of-a-kind to an nth-of-a-kind plant." },
        ],
        scale: { lo: "one bespoke, on-site megaproject", hi: "factory-replicated, demountable units" },
      },
      {
        eyebrow: "Axis 2 of 7",
        title: "Supply Chain",
        lead: "How heavily the concept depends on scarce, regulated, or commercially immature material supply chains.",
        sections: [
          { h: "How it's scored", p: "Flags critical-material bottlenecks — tritium, helium-3, beryllium, FLiBe, lithium-6 enrichment, nuclear-grade vanadium, KDP laser crystals — and weights them by severity. Helium-3 is the most severe." },
          { h: "Why it drives cost", p: "A concept can look cheap on paper and still be un-buildable at scale. Global civilian tritium inventory is only about 25 kg; helium-3 is far scarcer still. A material bottleneck both inflates cost and caps how many plants can ever exist — this axis is about whether a fleet is possible at all." },
        ],
        scale: { lo: "severe bottleneck (e.g. helium-3)", hi: "no scarce-material dependence" },
      },
      {
        eyebrow: "Axis 3 of 7",
        title: "Plant Complexity",
        lead: "How many coupled subsystems are required to build and operate the fusion powerplant?",
        sections: [
          { h: "How it's scored", p: "Counts and severity-weights demanding subsystems — among them the tritium plant, the cryoplant (4 K for low-temperature superconductors, 20 K for HTS), remote maintenance, a high-rate target factory, hybrid power conversion, pulsed-power buffers, disruption mitigation, and non-inductive current drive." },
          { h: "Why it drives cost", p: "In general, the more coupled subsystems a plant depends on, the harder it is to scale and the slower its potential learning rate — every added subsystem is another element that has to be engineered, integrated, and de-risked before costs can come down." },
        ],
        scale: { lo: "many critical subsystems", hi: "few hard subsystems" },
      },
      {
        eyebrow: "Axis 4 of 7",
        title: "Customization",
        lead: "How site- and licensing-flexible the plant is — how freely it can be built where the power is actually needed.",
        sections: [
          { h: "How it's scored", p: "Two factors: the cooling pathway (direct conversion, hybrid, or a thermal steam cycle) and the fuel's regulatory footprint — from D-T, which needs full tritium handling and a 14 MeV neutron exclusion zone, down to aneutronic p-B11." },
          { h: "Why it drives cost", p: "A water-cooled D-T plant needs cooling water, a large neutron exclusion zone, and a heavier nuclear-licensing path — all of which constrain where it can be sited and add balance-of-plant and regulatory cost. Regulatory burden is one of the largest swing factors in fusion capital-cost estimates. An air-coolable, aneutronic plant can sit far more freely." },
        ],
        scale: { lo: "water-cooled, full D-T licensing", hi: "air-coolable, aneutronic fuel" },
      },
      {
        eyebrow: "Axis 5 of 7",
        title: "Capacity Factor",
        lead: "The ceiling the architecture puts on capacity factor — or the maximum realistic share of the year the plant can generate its nameplate power.",
        sections: [
          { h: "How it's scored", p: "Penalizes design features that cap uptime: pulsed operation (dwell and recharge dead time), neutron-producing fuel (forced component-replacement outages), and non-renewable blankets (solid-breeder swap-outs)." },
          { h: "Why it drives cost", p: "Capacity factor is the denominator of LCOE. Capital cost is essentially fixed — the plant only earns while it runs — so halving uptime nearly doubles the cost per MWh. A pulsed, neutron-heavy concept has a low capacity-factor ceiling no matter how well it is operated." },
        ],
        scale: { lo: "low ceiling — pulsed and neutronic", hi: "steady-state, aneutronic, renewable blanket" },
      },
      {
        eyebrow: "Axis 6 of 7",
        title: "Technical Feasibility",
        lead: "How far the architecture's demonstrated plasma performance is from the threshold needed for fusion energy gain.",
        sections: [
          { h: "How it's scored", p: "Compares the best peer-reviewed triple product (n·T·τ — density times temperature times confinement time, the Lawson quantity) achieved by that architectural family against the value its fuel needs for breakeven, then buckets the gap on a log scale. Families with no peer-reviewed measurement floor at 1." },
          { h: "Why it drives cost", p: "This is the gate. If the physics is 10,000 times short of breakeven, there is no power plant — and the R&D cost and timeline to close that gap dwarf any plant-design saving. It is the one axis about whether the concept works at all, rather than how cheaply it would run." },
        ],
        scale: { lo: "very far from breakeven, or unproven", hi: "at or near demonstrated breakeven conditions" },
      },
      {
        eyebrow: "Axis 7 of 7",
        title: "Data Availability",
        lead: "A meta axis: how thoroughly the concept is documented — and therefore how much you can trust the other six scores.",
        sections: [
          { h: "How it's scored", p: "Counts the 'blocking' data gaps flagged in upstream agentic research — missing balance-of-plant cost, an underivable capacity factor, etc. — and buckets the count." },
          { h: "Why it matters", p: "It does not measure plant quality — a well-documented concept can still be a poor plant. It measures confidence. A concept riddled with blocking gaps has an LCOE estimate resting on assumptions; one with none has a number you can defend in a downselect." },
        ],
        scale: { lo: "many blocking data gaps", hi: "no blocking gaps — fully documented" },
      },
      {
        eyebrow: "The concept set",
        title: "Why these 39 concepts",
        lead: "The set is built to span the real design space of privately-funded fusion — genuinely different bets on how to make fusion electricity, not many near-duplicates of one idea.",
        sections: [
          { h: "Coverage", p: "It reaches across every confinement family: magnetic (tokamaks, stellarators, mirrors, field-reversed configurations), inertial (laser, heavy-ion, projectile), magneto-inertial, and non-standard approaches (electrostatic, dense plasma focus, accelerator-driven)." },
          { h: "How the 39 were chosen", p: "These concepts were selected for consideration due to their technical distinctiveness and commercial seriousness. If you believe that we are omitting a promising fusion approach, please contact us:" },
        ],
        cta: { label: "1cf.energy/contact", href: "https://1cf.energy/contact/" },
      },
    ];

    function Wizard({ steps, onFinish }) {
      const [i, setI] = useState(0);
      const step = steps[i];
      const last = i === steps.length - 1;
      return html`
        <div class="wizard">
          <div class="wizard-card">
            <div class="wizard-progress">
              ${steps.map((s, idx) => html`
                <div key=${idx}
                     class=${`dot ${idx < i ? "done" : ""} ${idx === i ? "current" : ""}`}
                     title=${s.title}
                     onClick=${() => setI(idx)}></div>
              `)}
            </div>
            ${step.eyebrow ? html`<div class="wizard-eyebrow">${step.eyebrow}</div>` : null}
            <h1>${step.title}</h1>
            <div class="wizard-lead">${step.lead}</div>
            ${(step.sections || []).map((sec, idx) => html`
              <div class="wizard-section" key=${idx}>
                <h3>${sec.h}</h3>
                <p>${sec.p}</p>
              </div>
            `)}
            ${step.scale ? html`
              <div class="wizard-scale">
                <div class="end lo">
                  <span class="n">Score 1</span>
                  <span class="t">${step.scale.lo}</span>
                </div>
                <div class="end hi">
                  <span class="n">Score 5</span>
                  <span class="t">${step.scale.hi}</span>
                </div>
              </div>
            ` : null}
            ${step.cta ? html`
              <a class="wizard-cta" href=${step.cta.href} target="_blank" rel="noopener">
                ${step.cta.label} →
              </a>
            ` : null}
            <div class="wizard-nav">
              <button disabled=${i === 0} onClick=${() => setI(i - 1)}>← Back</button>
              <span class="step-count">${i + 1} / ${steps.length}</span>
              <button class="primary"
                      onClick=${() => last ? onFinish() : setI(i + 1)}>
                ${last ? "Open the calculator →" : "Next →"}
              </button>
            </div>
          </div>
          <button class="wizard-skip" onClick=${onFinish}>
            Skip the walkthrough — go straight to the calculator
          </button>
        </div>
      `;
    }

    function scoreClass(v) {
      if (v == null) return "null";
      const n = Math.round(v);
      return `score-${Math.max(1, Math.min(5, n))}`;
    }
    function fmt(v, d = 2) { return v == null ? "—" : Number(v).toFixed(d); }
    function sci(v, d = 2) {
      if (v == null) return "—";
      return Number(v).toExponential(d);
    }

    // Plain-English score-tier descriptors (1-5).
    function scoreTier(v) {
      if (v == null) return "no data";
      const n = Math.round(v);
      return { 1: "very weak", 2: "weak", 3: "moderate", 4: "strong", 5: "very strong" }[n];
    }

    // Human labels for the architectural lookup keys.
    function mvsLabel(key) {
      const map = {
        "MFE|Tokamak (compact)":          "compact tokamak (~SMR-scale)",
        "MFE|Tokamak (spherical)":        "spherical tokamak (compact)",
        "MFE|Tokamak (negative-T)":       "negative-triangularity tokamak",
        "MFE|Tokamak (non-compact)":      "large LTS tokamak (megaproject-class)",
        "MFE|Stellarator":                "stellarator (W7-X class)",
        "MFE|FRC":                        "field-reversed configuration",
        "MFE|Mirror":                     "magnetic mirror",
        "MFE|Z-pinch (sheared-flow)":    "sheared-flow Z-pinch",
        "MFE|Levitated dipole":           "levitated dipole",
        "MIF|MagLIF":                     "MagLIF (pulsed liner)",
        "MIF|Pneumatic compression":      "pneumatic-compression MIF",
        "MIF|FRC compression":            "pulsed FRC compression (Helion-class)",
        "IFE|Laser":                      "laser ICF",
        "IFE|Laser (Xcimer-class)":       "KrF excimer laser ICF",
        "IFE|Laser (liquid jet)":         "liquid-jet laser ICF",
        "IFE|Heavy ion beam":             "heavy-ion-beam ICF",
        "IFE|Projectile":                 "projectile ICF",
        "IFE|Acoustic":                   "acoustic / sonofusion",
        "Non-Standard|Electrostatic":     "electrostatic (IEC / Polywell)",
        "Non-Standard|Plasma focus":      "dense plasma focus",
        "Non-Standard|Muon-catalyzed":    "muon-catalyzed",
        "Non-Standard|Particle accelerator": "accelerator-driven (beam-on-target)",
      };
      return map[key] || key;
    }
    function unitCountTier(N) {
      if (N == null) return "unknown unit count";
      if (N <= 1)  return "1 bespoke unit per plant";
      if (N <= 4)  return `${N} bespoke segments`;
      if (N <= 10) return `${N} replicated units (small array)`;
      if (N <= 30) return `${N} identical units (e.g., TF-coil set)`;
      return `${N}+ identical units (highly replicated)`;
    }
    function blanketModularityWord(rating) {
      return { 1: "bespoke", 2: "bespoke", 3: "standard",
               4: "modular", 5: "self-renewing / not needed" }[Math.round(rating)] || "moderate";
    }
    function magnetDriverWord(rating) {
      return { 1: "single bespoke driver", 2: "few bespoke pieces",
               3: "moderately modular", 4: "highly modular (integrated HTS)",
               5: "factory-replicated / demountable" }[Math.round(rating)] || "moderate";
    }
    function vesselModularityWord(rating) {
      return { 1: "single bespoke vessel", 2: "bespoke 3-D geometry",
               3: "compact bespoke", 4: "demountable sections",
               5: "replaceable liner / chamberless" }[Math.round(rating)] || "moderate";
    }

    // Build a multi-line, plain-English tooltip explaining the score.
    // Format: 1-line summary, blank line, 2-4 line driver list, optional
    // flags. Numbers minimized; nomenclature avoided where possible.
    function buildAxisTooltip(axis, concept) {
      const d = concept.diagnostics && concept.diagnostics[`${axis}_diagnostics`];
      if (!d) {
        if (axis === "data_availability") {
          return `No gap report for this concept yet.\n\nThis axis is null and is excluded from the composite (it doesn't pull the score down).\n\n⚠ Score not computable — analyst hasn't written the gap report.`;
        }
        return `${AXIS_LABEL[axis]}: no diagnostic data available.`;
      }

      // ──────────── Modularity ────────────
      if (axis === "modularity") {
        const v = d.modularity_score;
        const mvsLine = `Plant scalability: ${mvsLabel(d.mvs_lookup_key)} (${scoreTier(d.min_viable_device_scale)}).`;
        const subsysParts = [];
        if (d.vessel_modularity_rating)        subsysParts.push(`vessel ${vesselModularityWord(d.vessel_modularity_rating)}`);
        if (d.magnet_driver_modularity_rating) subsysParts.push(`magnet/driver ${magnetDriverWord(d.magnet_driver_modularity_rating)}`);
        if (d.blanket_modularity_rating)       subsysParts.push(`blanket ${blanketModularityWord(d.blanket_modularity_rating)}`);
        const subsysLine = `Major subsystems: ${subsysParts.join("; ")}.`;
        const umLine = `Replication: ${unitCountTier(d.unit_count_estimate)} → ${scoreTier(d.unit_multiplicity)}.`;

        const flags = [];
        if (d.capex_shares_used && d.capex_shares_used.method === "equal_weight_fallback_sparse_capex") {
          flags.push("⚠ Capex shares unreliable for this concept — used equal-weight fallback.");
        }
        if (d.capex_shares_used && d.capex_shares_used.method === "equal_weight_fallback_missing_capex") {
          flags.push("⚠ No cost model for this concept — used equal-weight fallback.");
        }
        if (d.blanket_assumed) {
          flags.push("⚠ Blanket = TBD; assumed Liquid metal.");
        }
        return [
          `Modularity ${fmt(v, 2)} of 5 (${scoreTier(v)}).`,
          "",
          "What drove the score:",
          `• ${mvsLine}`,
          `• ${subsysLine}`,
          `• ${umLine}`,
          ...(flags.length ? ["", ...flags] : []),
        ].join("\n");
      }

      // ──────────── Supply Chain ────────────
      if (axis === "supply_chain") {
        const v = d.supply_chain_score;
        const labels = {
          tritium:   "tritium handling",
          lithium6:  "Li-6 enrichment",
          helium3:   "helium-3 supply",
          beryllium: "beryllium supply",
          vanadium:  "nuclear-grade vanadium",
          flibe:     "FLiBe handling",
          kdp:       "KDP laser crystals",
        };
        const triggers = Object.keys(d.bottlenecks_triggered || {});
        const hasHe3 = triggers.includes("helium3");
        if (triggers.length === 0) {
          return [
            `Supply chain ${fmt(v, 2)} of 5 (${scoreTier(v)}).`,
            "",
            "No critical-material bottlenecks. Fuel and blanket choices avoid scarce or regulated supply chains.",
          ].join("\n");
        }
        const lead = hasHe3
          ? "Critical helium-3 bottleneck:"
          : `${triggers.length} supply bottleneck${triggers.length > 1 ? "s" : ""}:`;
        const list = triggers.map(t => `  • ${labels[t] || t}`).join("\n");
        const flags = d.blanket_assumed
          ? "\n\n⚠ Blanket = TBD; assumed Liquid metal (changes which materials are flagged)."
          : "";
        return [
          `Supply chain ${fmt(v, 2)} of 5 (${scoreTier(v)}).`,
          "",
          lead,
          list,
          flags ? flags : null,
        ].filter(Boolean).join("\n");
      }

      // ──────────── Plant Complexity ────────────
      if (axis === "plant_complexity") {
        const v = d.plant_complexity_score;
        const labels = {
          tritium_plant:           "tritium handling plant",
          remote_maintenance:      "remote maintenance (neutron activation)",
          hybrid_energy:           "hybrid power conversion",
          cryoplant_lts:           "LTS cryoplant (4 K)",
          cryoplant_hts:           "HTS cryoplant (20-77 K)",
          target_factory_high:     "high-rate target factory (CRITICAL)",
          target_factory_low:      "low-rate target factory",
          pulsed_power_thermal:    "pulsed-power + thermal buffer",
          high_power_aux:          "neutral-beam injection",
          rf_aux:                  "RF auxiliary heating",
          disruption_mitigation:   "disruption mitigation system",
          current_drive:           "non-inductive current drive",
          liquid_metal_handling:   "lithium / liquid-metal loops",
          levitation_stabilization:"magnet-levitation control",
        };
        const triggers = Object.entries(d.subsystems_triggered || {});
        const sortedByWeight = triggers.slice().sort((a, b) => b[1] - a[1]);
        const flags = d.blanket_assumed
          ? ["", "⚠ Blanket = TBD; assumed Liquid metal."]
          : [];
        if (triggers.length === 0) {
          return [`Plant complexity ${fmt(v, 2)} of 5 (${scoreTier(v)}).`,
                  "", "No major subsystem flags triggered."].concat(flags).join("\n");
        }
        return [
          `Plant complexity ${fmt(v, 2)} of 5 (${scoreTier(v)}).`,
          "",
          `${triggers.length} major subsystem${triggers.length > 1 ? "s" : ""} flagged:`,
          ...sortedByWeight.map(([k]) => `  • ${labels[k] || k}`),
          ...flags,
        ].join("\n");
      }

      // ──────────── Customization ────────────
      if (axis === "customization") {
        const v = d.customization_score;
        const aClass = (d.sub_factor_a || {}).classification;
        const fuel = (d.sub_factor_b || {}).value;
        const aWord = {
          direct_conversion: "direct conversion (air-coolable)",
          hybrid:            "hybrid (partial direct + thermal)",
          thermal:           "thermal cycle (needs cooling towers / water)",
        }[aClass] || aClass;
        const bWord = {
          "p-B11":  "aneutronic fuel (no tritium, no shielding zone)",
          "D-He3":  "low-neutron fuel (no tritium breeding)",
          "D-D":    "modest neutron output (no tritium breeding)",
          "D-T":    "full tritium handling + 14 MeV neutron exclusion zone",
        }[fuel] || fuel;
        return [
          `Site-customization ${fmt(v, 2)} of 5 (${scoreTier(v)}).`,
          "",
          "Higher = more site-flexible. Drivers:",
          `  • Cooling: ${aWord}`,
          `  • Fuel licensing: ${bWord}`,
        ].join("\n");
      }

      // ──────────── Upper CF ────────────
      if (axis === "upper_cf") {
        const v = d.upper_cf_score;
        const labels = {
          pulsed_operation:      "pulsed operation (dwell + recharge time)",
          neutronic_fuel:        "neutron-producing fuel (forced component replacement)",
          non_renewable_blanket: "non-renewable blanket (solid breeder swaps)",
        };
        const triggers = Object.keys(d.penalties_triggered || {});
        if (triggers.length === 0) {
          return [`Achievable capacity factor ${fmt(v, 2)} of 5 (${scoreTier(v)}).`,
                  "", "No operational CF penalties — steady-state, aneutronic fuel, renewable blanket."]
            .join("\n");
        }
        return [
          `Achievable capacity factor ${fmt(v, 2)} of 5 (${scoreTier(v)}).`,
          "",
          "Architecture caps the maximum uptime due to:",
          ...triggers.map(t => `  • ${labels[t] || t}`),
        ].join("\n");
      }

      // ──────────── Technical Feasibility ────────────
      if (axis === "technical_feasibility") {
        const v = d.technical_feasibility_score;
        if (d.no_data_floor) {
          return [
            `Technical feasibility ${fmt(v, 2)} of 5 (floor).`,
            "",
            "⚠ This architectural family has no peer-reviewed measurement of plasma triple product (n·T·τ).",
            "",
            "Could mean: too early to demonstrate, or fundamentally unmeasurable by Lawson framework (e.g., accelerator-driven, muon-catalyzed). Score floors at 1.0 — not a physics judgment, just absence of evidence.",
          ].join("\n");
        }
        const log = d.log10_gap;
        let gapWord;
        if (log == null) gapWord = "uncertain";
        else if (log <= 0)  gapWord = "at or above the required value";
        else if (log <= 1)  gapWord = "within 10× of the required value";
        else if (log <= 3)  gapWord = "10× to 1000× below the required value";
        else if (log <= 5)  gapWord = "1000× to 100,000× below";
        else                gapWord = "more than 100,000× below";
        const lines = [
          `Technical feasibility ${fmt(v, 2)} of 5 (${scoreTier(v)}).`,
          "",
          `This architectural family has demonstrated plasma triple product`,
          `${gapWord} of the threshold for fusion breakeven with its fuel.`,
        ];
        if (d.laser_approach_modifier && d.laser_approach_modifier !== 0) {
          const sign = d.laser_approach_modifier > 0 ? "+" : "";
          lines.push("", `(Laser approach modifier ${sign}${d.laser_approach_modifier}: this drive method is less mature than NIF indirect-drive ignition.)`);
        }
        return lines.join("\n");
      }

      // ──────────── Data Availability ────────────
      if (axis === "data_availability") {
        const v = d.data_availability_score;
        if (!d.report_exists) {
          return [
            `Data availability: not yet evaluated.`,
            "",
            "⚠ No gap report has been written for this concept. Score is null and excluded from the composite.",
          ].join("\n");
        }
        const n = d.blocking_count;
        let descriptor;
        if (n === 0)       descriptor = "well-documented — no critical gaps flagged";
        else if (n <= 2)   descriptor = "mostly documented — 1-2 critical gaps";
        else if (n <= 5)   descriptor = `${n} critical gaps`;
        else if (n <= 9)   descriptor = `${n} significant gaps`;
        else               descriptor = `${n}+ critical gaps (very thinly documented)`;
        return [
          `Data availability ${fmt(v, 2)} of 5 (${scoreTier(v)}).`,
          "",
          `Gap report flags this concept as ${descriptor}.`,
        ].join("\n");
      }

      return `${AXIS_LABEL[axis]}: ${fmt(concept.scores[axis], 2)} of 5.`;
    }

    // Composite tooltip: lists which axes contributed and how.
    function buildCompositeTooltip(concept) {
      const v = concept._composite;
      const inc = concept._included || [];
      const all = AXES.length;
      const lines = [
        `Composite ${fmt(v, 2)} of 5 (${scoreTier(v)}).`,
        "",
        `Weighted average of ${inc.length} of ${all} axes.`,
      ];
      const skipped = AXES.filter(a => !inc.includes(a));
      if (skipped.length) {
        lines.push("", `Skipped (no data): ${skipped.map(a => AXIS_LABEL[a]).join(", ")}.`);
      }
      return lines.join("\n");
    }

    function recompositeOne(concept, axisWeights) {
      const included = AXES.filter(a =>
        concept.scores[a] != null && (axisWeights[a] || 0) > 0);
      if (!included.length) return { composite: null, included: [] };
      const norm = included.reduce((s, a) => s + axisWeights[a], 0);
      if (norm === 0) return { composite: null, included };
      const composite = included.reduce(
        (s, a) => s + concept.scores[a] * axisWeights[a], 0) / norm;
      return { composite, included };
    }

    function App() {
      const [concepts, setConcepts] = useState(null);
      const [weights, setWeights]   = useState(null);
      const [axisWeights, setAxisWeights] = useState(null);
      const [selected, setSelected] = useState(null);
      const [activePreset, setActivePreset] = useState("Equal");
      const [expandedAxis, setExpandedAxis] = useState(null);
      const [filter, setFilter] = useState("");
      const [fuelFilter, setFuelFilter] = useState("All");
      const [familyFilter, setFamilyFilter] = useState("All");
      const [includeLowReadiness, setIncludeLowReadiness] = useState(false);
      const [sortBy, setSortBy] = useState("composite");
      const [sortDir, setSortDir] = useState("desc");
      const [loadError, setLoadError] = useState(null);
      const [view, setView] = useState(() => {
        try { return localStorage.getItem("fce_wizard_seen") ? "calc" : "wizard"; }
        catch (e) { return "wizard"; }
      });

      useEffect(() => {
        Promise.all([
          fetch("data/concepts.json").then(r => {
            if (!r.ok) throw new Error(`concepts.json: HTTP ${r.status}`);
            return r.json();
          }),
          fetch("data/weights.json").then(r => {
            if (!r.ok) throw new Error(`weights.json: HTTP ${r.status}`);
            return r.json();
          }),
        ]).then(([c, w]) => {
          setConcepts(c);
          setWeights(w);
          setAxisWeights(Object.fromEntries(w.axes.map(a => [a.name, a.axis_weight])));
        }).catch(e => setLoadError(e.message || String(e)));
      }, []);

      const composited = useMemo(() => {
        if (!concepts || !axisWeights) return [];
        return concepts.map(c => {
          const { composite, included } = recompositeOne(c, axisWeights);
          return Object.assign({}, c, { _composite: composite, _included: included });
        });
      }, [concepts, axisWeights]);

      const filtered = useMemo(() => {
        let rows = composited;
        if (filter) {
          const f = filter.toLowerCase();
          rows = rows.filter(c =>
            c.name.toLowerCase().includes(f) ||
            c.concept_id.toLowerCase().includes(f));
        }
        if (fuelFilter !== "All")   rows = rows.filter(c => c.features.fuel === fuelFilter);
        if (familyFilter !== "All") rows = rows.filter(c => c.features.confinement_family === familyFilter);
        if (!includeLowReadiness) {
          // Hide the low-readiness tier: Technical Feasibility at the floor (score <= 1).
          rows = rows.filter(c => {
            const tf = c.scores.technical_feasibility;
            return tf == null || tf > 1;
          });
        }
        return rows;
      }, [composited, filter, fuelFilter, familyFilter, includeLowReadiness]);

      const sorted = useMemo(() => {
        if (!filtered.length) return filtered;
        const dir = sortDir === "asc" ? 1 : -1;
        return filtered.slice().sort((a, b) => {
          let av, bv;
          if (sortBy === "composite")  { av = a._composite; bv = b._composite; }
          else if (sortBy === "name")  { return dir * a.name.localeCompare(b.name); }
          else                          { av = a.scores[sortBy]; bv = b.scores[sortBy]; }
          if (av == null && bv == null) return 0;
          if (av == null) return 1;
          if (bv == null) return -1;
          return dir * (av - bv);
        });
      }, [filtered, sortBy, sortDir]);

      function setAxisWeight(axis, value) {
        setAxisWeights(prev => Object.assign({}, prev, { [axis]: value }));
        setActivePreset(null);
      }
      function applyPreset(name) {
        setActivePreset(name);
        setAxisWeights(Object.assign({}, PRESETS[name]));
      }
      function exportCsv() {
        const cols = ["concept_id", "name", ...AXES, "composite"];
        const lines = [cols.join(",")];
        sorted.forEach(c => {
          lines.push([
            c.concept_id,
            `"${c.name.replace(/"/g, '""')}"`,
            ...AXES.map(a => c.scores[a] != null ? c.scores[a].toFixed(4) : ""),
            c._composite != null ? c._composite.toFixed(4) : "",
          ].join(","));
        });
        downloadFile("rankings.csv", lines.join("\n"), "text/csv");
      }
      function exportJson() {
        downloadFile("rankings.json", JSON.stringify({
          axis_weights: axisWeights,
          generated_at: new Date().toISOString(),
          rankings: sorted.map(c => ({
            concept_id: c.concept_id, name: c.name,
            scores: c.scores, composite: c._composite,
            composite_axes_included: c._included,
          })),
        }, null, 2), "application/json");
      }
      function downloadFile(name, content, mime) {
        const blob = new Blob([content], { type: mime });
        const url  = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
      }

      function finishWizard() {
        try { localStorage.setItem("fce_wizard_seen", "1"); } catch (e) {}
        setView("calc");
      }
      function openWizard() { setView("wizard"); }

      if (view === "wizard") {
        return html`<${Wizard} steps=${WIZARD_STEPS} onFinish=${finishWizard}/>`;
      }
      if (loadError) {
        return html`
          <div class="fatal-error">
            <h2>Failed to load data</h2>
            <pre>${loadError}</pre>
            <p style=${{ color: "var(--text-dim)", marginTop: 12 }}>
              Make sure you're serving the directory over HTTP
              (not file://) and that data/concepts.json + data/weights.json
              are present. Run
              <code>uv run python tools/score_explorer/build.py</code>
              from the repo root to regenerate them.
            </p>
          </div>
        `;
      }
      if (!concepts || !weights || !axisWeights) {
        return html`<div style=${{ padding: 24 }}>Loading…</div>`;
      }

      const fuels    = ["All", ...new Set(concepts.map(c => c.features.fuel).filter(Boolean))];
      const families = ["All", ...new Set(concepts.map(c => c.features.confinement_family).filter(Boolean))];
      const lowReadinessCount = concepts.filter(c => {
        const tf = c.scores.technical_feasibility;
        return tf != null && tf <= 1;
      }).length;

      const sliderRows = weights.axes.map(axisInfo => {
        const a = axisInfo.name;
        const w = axisWeights[a];
        const hasSubTables = Object.keys(axisInfo.sub_tables || {}).length > 0;
        const advancedPanel = expandedAxis === a && hasSubTables ? html`
          <div class="advanced-panel">
            ${Object.entries(axisInfo.sub_tables).map(([tname, tbl]) => html`
              <div key=${tname}>
                <div class="table-name">${tname}</div>
                ${(Array.isArray(tbl)
                  ? tbl.map((v, i) => [`#${i}`, JSON.stringify(v)])
                  : Object.entries(tbl)
                ).map(([k, v], i) => html`
                  <div class="row" key=${i}>
                    <span class="k">${k}</span>
                    <span class="v">${typeof v === "object" ? JSON.stringify(v) : String(v)}</span>
                  </div>
                `)}
              </div>
            `)}
            <div style=${{ marginTop: 6, color: "var(--text-dim)" }}>
              Sub-tables are read-only here. Edit weights/default.yaml + re-run
              score.py + build.py to change them.
            </div>
          </div>
        ` : null;
        return html`
          <div class="slider-row" key=${a}>
            <div class="label">
              <span class="name">${AXIS_LABEL[a]}</span>
              <span class="value">${w.toFixed(2)}</span>
            </div>
            <input type="range" min="0" max="3" step="0.05" value=${w}
                   onChange=${e => setAxisWeight(a, parseFloat(e.target.value))}/>
            ${hasSubTables ? html`
              <div class="advanced"
                   onClick=${() => setExpandedAxis(expandedAxis === a ? null : a)}>
                ${expandedAxis === a ? "▾" : "▸"} Advanced (sub-tables)
              </div>
            ` : null}
            ${advancedPanel}
          </div>
        `;
      });

      const tableRows = sorted.map(c => html`
        <tr key=${c.concept_id}
            class=${selected && selected.concept_id === c.concept_id ? "selected" : ""}
            onClick=${() => setSelected(c)}>
          <td class="concept-cell">
            <div class="display-name">${c.display_name || c.name}</div>
            ${c.company ? html`<div class="company">${c.company}</div>` : null}
            <div class="meta">${c.features.confinement_family} · ${c.features.fuel}</div>
          </td>
          ${AXES.map(a => {
            const v = c.scores[a];
            return html`
              <td key=${a} class=${`num ${scoreClass(v)}`}
                  data-tooltip=${buildAxisTooltip(a, c)}>
                ${fmt(v, 2)}
              </td>
            `;
          })}
          <td class="composite" data-tooltip=${buildCompositeTooltip(c)}>
            ${fmt(c._composite, 2)}
          </td>
        </tr>
      `);

      const detailPanel = selected ? html`
        <div class="detail">
          <h2>Concept detail</h2>
          <div class="concept-name">${selected.display_name || selected.name}</div>
          ${selected.company ? html`
            <div style=${{ color: "var(--accent)", fontSize: 13, marginTop: -4, marginBottom: 8 }}>
              ${selected.company}
            </div>
          ` : null}

          <h3>Features</h3>
          <div class="features-grid">
            ${Object.entries(selected.features).map(([k, v]) => html`
              <div key=${k}><span class="k">${k}:</span> <span class="v">${String(v)}</span></div>
            `)}
          </div>

          <h3>Composite</h3>
          <div style=${{ marginBottom: 8, fontSize: 13 }}>
            <span class=${scoreClass(selected._composite)} style=${{ fontSize: 18, fontWeight: 600 }}>
              ${fmt(selected._composite, 2)}
            </span>
            ${" — "}
            <span style=${{ color: "var(--text-dim)" }}>
              weighted mean of ${selected._included.length} of 7 axes
              ${selected._included.length < 7 ? html`
                <span> (skipped: ${AXES.filter(a => !selected._included.includes(a))
                                       .map(a => AXIS_LABEL[a]).join(", ")})</span>
              ` : null}
            </span>
          </div>

          <h3>Per-axis breakdown</h3>
          ${AXES.map(a => {
            const block = selected.diagnostics && selected.diagnostics[`${a}_diagnostics`];
            const v = selected.scores[a];
            return html`
              <div class="diagnostic" key=${a}>
                <h3>
                  <span>${AXIS_LABEL[a]}</span>
                  <span class=${`axis-score ${scoreClass(v)}`}>${fmt(v, 2)}</span>
                </h3>
                ${block
                  ? html`<pre>${JSON.stringify(block, null, 2)}</pre>`
                  : html`<div class="null" style=${{ fontSize: 12 }}>(no diagnostic block)</div>`
                }
              </div>
            `;
          })}
        </div>
      ` : null;

      return html`
        <div class="app">
          <aside class="sidebar">
            <h1>Score Explorer</h1>
            <div class="subtitle">7 axes · ${concepts.length} concepts</div>

            <h2 style=${{ marginTop: 18 }}>Presets</h2>
            <div class="presets">
              ${Object.keys(PRESETS).map(name => html`
                <button key=${name}
                        class=${activePreset === name ? "active" : ""}
                        onClick=${() => applyPreset(name)}>${name}</button>
              `)}
            </div>

            <h2>Axis weights</h2>
            ${sliderRows}

            <div class="actions">
              <button onClick=${exportCsv}>Export CSV</button>
              <button onClick=${exportJson}>Export JSON</button>
            </div>

            <label class="readiness-toggle"
                   title="Low-readiness tier = Technical Feasibility at the floor (score ≤ 1): the architectural family has no peer-reviewed triple-product measurement, or sits a very large gap from fusion breakeven. Hidden by default.">
              <input type="checkbox" checked=${includeLowReadiness}
                     onChange=${e => setIncludeLowReadiness(e.target.checked)}/>
              <span>Include low-readiness tier <span class="rt-count">${lowReadinessCount} / ${concepts.length}</span></span>
            </label>
          </aside>

          <main class="main">
            <div class="header">
              <div>
                <h1>Concept rankings</h1>
                <div class="subtitle">
                  Slide an axis weight to re-rank instantly. Click a row for details.
                </div>
              </div>
              <button class="guide-btn" onClick=${openWizard}>↩ Walkthrough</button>
            </div>

            <div class="filter-bar">
              <input type="search" placeholder="Filter by name / ID…"
                     value=${filter} onChange=${e => setFilter(e.target.value)}/>
              <select value=${fuelFilter} onChange=${e => setFuelFilter(e.target.value)}>
                ${fuels.map(f => html`<option key=${f} value=${f}>Fuel: ${f}</option>`)}
              </select>
              <select value=${familyFilter} onChange=${e => setFamilyFilter(e.target.value)}>
                ${families.map(f => html`<option key=${f} value=${f}>Family: ${f}</option>`)}
              </select>
            </div>

            <table class="ranking">
              <thead>
                <tr>
                  <th class=${sortBy === "name" ? "sorted" : ""}
                      onClick=${() => { setSortBy("name"); setSortDir(sortDir === "asc" ? "desc" : "asc"); }}>
                    Concept
                  </th>
                  ${AXES.map(a => html`
                    <th key=${a}
                        class=${sortBy === a ? "sorted" : ""}
                        title=${`Axis weight: ${axisWeights[a].toFixed(2)}`}
                        onClick=${() => { setSortBy(a); setSortDir(sortDir === "asc" && sortBy === a ? "desc" : "asc"); }}>
                      ${AXIS_LABEL[a]}
                    </th>
                  `)}
                  <th class=${sortBy === "composite" ? "sorted" : ""}
                      onClick=${() => { setSortBy("composite"); setSortDir(sortDir === "asc" ? "desc" : "asc"); }}>
                    Composite
                  </th>
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>

            ${detailPanel}

            <div class="footer">
              Data generated by <code>tools/score_explorer/build.py</code>.
              Edit <code>weights/default.yaml</code> and re-run
              <code>score.py</code> + <code>build.py</code> to refresh.
            </div>
          </main>
        </div>
      `;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
  </script>
</body>
</html>
